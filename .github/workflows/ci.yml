name: CI

on:
  push:
    branches: [main]
  # Run on stacked PR bases as well as main.
  pull_request:
  # The spec update workflow dispatches CI on its PR branch. PRs opened by the
  # Actions token do not trigger pull_request runs.
  workflow_dispatch:
    inputs:
      update_pr_head_sha:
        description: Head commit of the automated spec update PR
        required: false
        type: string

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      # Without this, one platform failing cancels the others mid-run and they
      # report as failures too, hiding which platform actually broke.
      fail-fast: false
      matrix:
        os: [blacksmith-2vcpu-ubuntu-2404]
        node-version: [20, 22, 24]
        # The install wizard has Windows-specific Claude Code detection and npm
        # package-launch paths. The suite models the published native-bin package in
        # a space-containing global prefix and proves its .cmd shim is bypassed.
        # Without a Windows runner a Windows-only regression ships unnoticed —
        # which is how issue #56 happened. One combination is enough: the rest of
        # the suite is platform-agnostic.
        include:
          - os: windows-latest
            node-version: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      # The spec drift check and its tests run the live spec through the SDK's
      # patch layer (packages/typescript-api-sdk/scripts/fix_spec.py).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installing also builds packages/typescript-api-sdk (its `prepare`
      # script), which everything below imports.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the spec patch layer's Python dependencies
        run: python -m pip install -r packages/typescript-api-sdk/scripts/requirements.txt

      - name: Check generated tools are current
        run: pnpm generate:check

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # Tests run through tsx (`node --import tsx --test`) and compile TS on the
      # fly — they need no build output, so Test can safely precede Build.
      - name: Test
        run: pnpm test

      # A drifted vendored spec must not merge: fail the required job on real
      # drift (exit 1), but only warn when the live spec is unreachable
      # (exit 2) — a network blip is not a drift verdict. Linux/node-22 only;
      # drift is platform-independent.
      - name: Check spec drift against the live production spec
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        shell: bash
        run: |
          set +e
          pnpm spec:check
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::spec-drift: live spec unreachable — drift not judged this run."
            exit 0
          fi
          exit $rc

      # Linux only. On windows-latest tsup emits every bundle successfully and then
      # the process dies with 0xC0000374 (STATUS_HEAP_CORRUPTION) — a crash in the
      # bundler after its work is done, not a problem with the source. The package
      # is published from Linux, and the Windows runner is here to catch
      # platform-specific regressions in the install wizard, which the Test step
      # above covers. Revisit if a contributor needs `pnpm build` on Windows.
      - name: Build
        if: runner.os != 'Windows'
        run: pnpm run build

  # The published @runpod/typescript-api-sdk package. Its engines field allows
  # Node 20+, so each supported major is checked.
  sdk:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the spec patch layer's Python dependencies
        run: python -m pip install -r packages/typescript-api-sdk/scripts/requirements.txt

      # Generated schema freshness, patch layer, query contract, typecheck,
      # unit tests, packed-package contents, and examples.
      - name: SDK checks
        run: pnpm sdk:check

  report-spec-update:
    # A workflow_dispatch job's own checks are not attached to the PR. Publish
    # the matrix result as a commit status on the PR head instead.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.update_pr_head_sha != ''
    needs: [test, sdk]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      statuses: write
    steps:
      - name: Report CI on the spec update PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.update_pr_head_sha }}
          MATRIX_RESULT: ${{ needs.test.result == 'success' && needs.sdk.result == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$MATRIX_RESULT" = success ]; then
            state=success
          else
            state=failure
          fi
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=automation/spec-update-ci \
            -f description="CI matrix: $MATRIX_RESULT" \
            -f target_url="$RUN_URL" >/dev/null
