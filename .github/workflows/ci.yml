name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20, 22]
        # The install wizard has Windows-specific code paths (Claude Code
        # detection, and refusing to shell out for a .cmd shim). Without a Windows
        # runner a POSIX-only regression there ships unnoticed — which is how
        # issue #56 happened. One combination is enough: the rest of the suite is
        # platform-agnostic.
        include:
          - os: windows-latest
            node-version: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # Tests run through tsx (`node --import tsx --test`) and compile TS on the
      # fly — they need no build output, so Test can safely precede Build.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

