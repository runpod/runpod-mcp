name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      # Without this, one platform failing cancels the others mid-run and they
      # report as failures too, hiding which platform actually broke.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20, 22]
        # The install wizard has Windows-specific Claude Code detection and npm
        # package-launch paths. The suite models the published native-bin package in
        # a space-containing global prefix and proves its .cmd shim is bypassed.
        # Without a Windows runner a Windows-only regression ships unnoticed —
        # which is how issue #56 happened. One combination is enough: the rest of
        # the suite is platform-agnostic.
        include:
          - os: windows-latest
            node-version: 22

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      # Tests run through tsx (`node --import tsx --test`) and compile TS on the
      # fly — they need no build output, so Test can safely precede Build.
      - name: Test
        run: pnpm test

      # Linux only. On windows-latest tsup emits every bundle successfully and then
      # the process dies with 0xC0000374 (STATUS_HEAP_CORRUPTION) — a crash in the
      # bundler after its work is done, not a problem with the source. The package
      # is published from Linux, and the Windows runner is here to catch
      # platform-specific regressions in the install wizard, which the Test step
      # above covers. Revisit if a contributor needs `pnpm build` on Windows.
      - name: Build
        if: runner.os != 'Windows'
        run: pnpm run build

