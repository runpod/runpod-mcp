name: runner-probe
on: pull_request
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    strategy:
      matrix:
        runner: [blacksmith-2vcpu-ubuntu-2404, runpod-4vCPU-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      # Prints only the runner_environment claim from the OIDC token, never the token
      - run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{runner_environment}' || true
          echo "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT"
