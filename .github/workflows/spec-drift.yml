# Alerts when the vendored OpenAPI spec no longer matches what the production
# API serves — the signal that `specgen/spec/openapi.yaml` needs a re-vendor
# and `pnpm generate:tools` a re-run (see specgen/README.md).
#
# Runs daily, on demand, and on PRs that touch the generation inputs. The PR
# trigger keeps a stale spec from shipping *with a specgen change*; unrelated
# PRs are not blocked by upstream churn.
name: Spec drift

on:
  schedule:
    - cron: '17 9 * * *' # daily
  workflow_dispatch:
  pull_request:
    paths:
      - 'specgen/**'
      - 'src/specgen/generated/**'
      - 'scripts/check-spec-drift.ts'

jobs:
  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare vendored spec against the live production spec
        run: pnpm spec:check
