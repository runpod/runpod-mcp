# Alerts when the vendored OpenAPI spec no longer matches what the production
# API serves — the signal that `packages/typescript-api-sdk/spec/openapi.yaml`
# needs a re-vendor (`pnpm spec:pull`) and `pnpm generate` a re-run (see
# specgen/README.md).
#
# Runs daily, on demand, and on every PR — any PR shows at a glance whether
# the vendored spec is current. It reports as its own check (spec-drift), so
# whether a red result blocks merging is a branch-protection choice: leave it
# out of the required checks and upstream churn stays visible without
# stopping unrelated work.
name: Spec drift

on:
  schedule:
    - cron: '17 9 * * *' # daily
  workflow_dispatch:
    inputs:
      update_pr_head_sha:
        description: Head commit of the automated spec update PR
        required: false
        type: string
  pull_request:

permissions:
  contents: read

jobs:
  spec-drift:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r packages/typescript-api-sdk/scripts/requirements.txt
      - name: Compare vendored spec against the live production spec
        run: pnpm spec:check

  report-update-pr:
    # PRs created by the Actions token do not trigger pull_request workflows.
    # Put the dispatched drift result on that PR's head as a commit status.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.update_pr_head_sha != ''
    needs: spec-drift
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      statuses: write
    steps:
      - name: Report spec drift on the update PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.update_pr_head_sha }}
          DRIFT_RESULT: ${{ needs.spec-drift.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$DRIFT_RESULT" = success ]; then
            state=success
          else
            state=failure
          fi
          gh api "repos/$GH_REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context=spec-drift \
            -f description="Spec drift check: $DRIFT_RESULT" \
            -f target_url="$RUN_URL" >/dev/null
