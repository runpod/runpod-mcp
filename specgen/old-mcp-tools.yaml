# Parity manifest against the official Runpod MCP server
# (github.com/runpod/runpod-mcp at f20d987, 54 tools). Every tool the official
# server exposes maps to a tool this server exposes; tests/old-mcp-parity.test.ts
# enforces that each `to` target exists in the served surface.
#
# how: generated   — emitted from the v2 OpenAPI spec by the generator
#      curated     — hand-written in src/tools/ (plane not covered by the spec,
#                    or the transport/output needs shaping)
# args (optional)  — fixed arguments that select the old tool's behavior on the
#                    mapped tool.
#
# Not tool-surface items, deliberately not ported: the hosted HTTP/OAuth
# transport, caller-tracking headers, the v1 REST fallback (this server is
# v2-only), and the install wizard's credential pre-flight.

tools:
  - { old: cancel-job, to: cancel-job, how: curated }
  - { old: create-container-registry-auth, to: create-registry, how: generated }
  - { old: create-endpoint, to: create-endpoint, how: generated }
  - { old: create-network-volume, to: create-network-volume, how: generated }
  - { old: create-pod, to: create-pod, how: generated }
