# Controls the spec-to-tools generation. Every operation in spec/openapi.yaml
# becomes a tool unless excluded here; the parity test enforces exactly that.

# The generator rejects exclusions whose operationId is absent from the spec.
# replacedBy identifies the curated replacement in src/specgen/tools/; once
# the server is wired, tests/specgen-gates.test.ts checks replacement registration.
exclude:
  listEndpoints:
    replacedBy: list-endpoints
    reason: trimmed, paginated output — full endpoint objects carry env maps
      and requestUrls (six derivable URLs per endpoint) that dominate the
      payload and blow up LLM context on accounts with many endpoints
  listTemplates:
    replacedBy: list-templates
    reason: trimmed output — full template objects blow up LLM context
  getPodLogs:
    replacedBy: stream-pod-logs
    reason: text/event-stream, held open to tail live output — the generated
      JSON dispatch cannot consume it
  getWorkerLogs:
    replacedBy: stream-worker-logs
    reason: text/event-stream, held open to tail live output — the generated
      JSON dispatch cannot consume it

# operationId -> tool name overrides; default is the kebab-cased operationId.
rename: {}

# operationId -> title overrides (tools/list `title`, the human-readable name
# hosts show). The default is derived from the tool name in sentence case with
# proper nouns kept (src/specgen/titles.ts); override only where that reads
# wrong. The generator rejects keys whose operationId is absent from the spec.
titles:
  podAction: Start, stop, restart, or terminate a Pod
  createRegistry: Create registry credential
  deleteRegistry: Delete registry credential
  getRegistry: Get registry credential
  listRegistries: List registry credentials
  createDelegation: Create ECR delegation
  listDelegations: List ECR delegations
  revokeDelegation: Revoke ECR delegation

# operationId -> annotation overrides, merged over the hints derived from the
# HTTP method. Use for operations whose method misstates what they do: a write
# is destructive when it can delete a resource, lose data that cannot be read
# back, or interrupt work in flight; a PATCH that only sets the fields it names
# (a rename) is not. The generator rejects keys whose operationId is absent
# from the spec, and tests/specgen-annotations.test.ts pins the result.
annotations:
  # POST, but action terminate deletes the pod (equivalent to deletePod). A
  # host lists tools before it sees the argument, so the whole tool is marked.
  podAction:
    destructiveHint: true
  # PUT that replaces the whole key set, removing every key not in the request.
  updateSshKeys:
    destructiveHint: true
  # PATCH, but not additive: sending gpu.pools clears exclusions, cpu and the
  # network/global volume lists replace what is there (detaching the rest),
  # and a container change rolls a new release onto the workers. A repeated
  # container change can cut another release, so it stays non-idempotent.
  updateEndpoint:
    destructiveHint: true
  # PATCH, but a container change (image, args, env, ports, disk) restarts the
  # container and wipes its ephemeral disk; repeating it restarts it again.
  updatePod:
    destructiveHint: true
  # Overwrites a write-only value: the previous one cannot be read back.
  # Stays non-idempotent because each value write is recorded as a rotation.
  updateSecret:
    destructiveHint: true
  # The name is unique and immutable, so a repeat is rejected with 409 rather
  # than creating a second secret.
  createSecret:
    idempotentHint: true
  # PATCHes that set absolute values: repeating one lands on the same state.
  updateCluster:
    idempotentHint: true
  updateGlobalVolume:
    idempotentHint: true
  updateNetworkVolume:
    idempotentHint: true
  # PATCH, but it overwrites the image, env, registry and container settings
  # and can flip a private template public; the old values are not kept.
  updateTemplate:
    idempotentHint: true
    destructiveHint: true

# operationId -> description overrides; default is the spec summary+description.
# The mutation-tool overrides carry the critical gotchas inline so the
# BARE-CLIENT path (no skills installed) still sees them at tool-choice time.
descriptions:
  listServerlessBilling: >-
    Get serverless billing history, split into time buckets. SIZE WARNING: with
    defaults this emits one record per endpoint PER BUCKET — on an account with
    many endpoints the response overflows the tool-result limit and becomes
    unusable. Always pass lastN: 1 (or a bucketSize spanning the whole window)
    for one record per endpoint, and serverlessId when you need one endpoint.
    Distinct from pod billing, which covers standalone pods.
  createEndpoint: >-
    Create a serverless endpoint. BILLABLE: state the worker's hourly price
    (from the catalog tools) before creating. Worker hardware is one of two
    choices: the gpu object (gpu.pools takes serverless pool ids from the
    catalog, e.g. ADA_24, never display names; gpu.count sets GPUs per worker)
    or the cpu array of CPU flavor configurations for a CPU endpoint. type and
    scaling are required and fix the request-routing model. Workers cold-start
    on the first job: expect minutes, poll with get-job-status wait.
  updateEndpoint: >-
    Partially update a serverless endpoint (PATCH): only fields present in the
    body change, omitted ones are untouched, with one exception. DESTRUCTIVE
    GOTCHA: gpu.pools and gpu.excludedTypes are a single selection, so sending
    pools without excludedTypes clears any exclusions pinned elsewhere (the
    console or set-endpoint-gpus) — read the endpoint first with get-endpoint
    and resend excludedTypes if you still want them. An exclusion naming a type
    outside pools returns 400. A CUDA-only or count-only change does not need
    pools at all, so omit it unless you mean to replace the selection. Mutable
    fields: name, gpu, cpu, workers (min/max/idleTimeout), scaling (type plus
    queueDelay or requestCount), dataCenterIds, networkVolumes, timeout,
    flashboot, and the container settings (image, args, disk, ports, env,
    registry). cpu completely replaces a CPU endpoint's flavor selection.
    Compute family is immutable: gpu on a CPU endpoint, cpu on a GPU one, or
    both, returns 400.
    Effect timing differs by field — workers/scaling/timeout reach the
    autoscaler promptly, while container changes (image, env) cut a new release
    that rolls out as workers cycle, so in-flight workers keep the previous
    version. Track rollout with list-endpoint-releases.
  createPod: >-
    Rent a GPU/CPU pod. BILLABLE from creation until stop/terminate: state the
    hourly price before creating. GPU selection is the gpu object: gpu.id takes
    a catalog GPU type id (e.g. "NVIDIA GeForce RTX 4090"), verified via
    list-gpu-types, and gpu.count sets the GPU count; cloud/data-center choice
    constrains stock.
  deleteEndpoint: >-
    Delete a serverless endpoint permanently and immediately. Verify the id
    belongs to the intended endpoint (get-endpoint) before deleting; delete
    only endpoints your own tool calls created in this conversation, or the
    one the user asked you to delete by id — a name found by listing is not
    attribution.
  deleteTemplate: >-
    Delete a template permanently. Verify with get-template first; a template
    referenced by a live endpoint should not be deleted.
  deletePod: >-
    Terminate a pod permanently — its container disk is lost. Distinguish from
    stopping (pod-action stop) which releases the GPU but keeps volume data.
    Verify the id with get-pod first; terminate only pods your own tool calls
    created in this conversation, or the one the user asked you to terminate
    by id — a name found by listing is not attribution.
  createCluster: >-
    Create an instant cluster (multiple pods with high-speed interconnect).
    BILLABLE from creation for every pod in the cluster: it rents
    compute.podCount identical pods at once, each with compute.gpuCountPerPod
    GPUs of compute.gpuTypeId — state the hourly price for the total GPU count
    (podCount * gpuCountPerPod, priced from the catalog tools) and create only
    after the user's explicit go on that quoted shape and total hourly price.
    Verify GPU stock first via the catalog tools. The compute shape and type
    are fixed at creation; only the name can be changed later. The container
    configuration applies to every pod, and templateId is the only
    private-image path — a bare registry property is rejected. Delete with
    delete-cluster when finished.
  deleteCluster: >-
    Delete a cluster permanently: it terminates every member pod. Verify the id
    with get-cluster, and list-cluster-pods for what the delete takes down,
    before deleting; delete only clusters your own tool calls created in this
    conversation, or the one the user asked you to delete by id — a name found
    by listing is not attribution.
  deleteSecret: >-
    Delete a secret permanently. Environment variables referencing its name
    ({{ RUNPOD_SECRET_<name> }}) stop resolving at the next pod or worker boot;
    running instances keep the value they started with. Verify the id with
    get-secret first; delete only secrets your own tool calls created in this
    conversation, or the one the user asked you to delete by id — a name found
    by listing is not attribution.

# operationId -> description served only in the directory profile
# (mcp.runpod.io/directory, src/specgen/profile.ts). App directories reject
# descriptions that instruct the model or name other tools, so these state
# what the operation does and keep billing and permanence as facts. Default
# connections keep the descriptions above. The generator rejects keys whose
# operationId is absent from the spec.
directoryDescriptions:
  createCluster: >-
    Create an Instant Cluster: compute.podCount identical Pods joined by a
    high-speed interconnect, each with compute.gpuCountPerPod GPUs of
    compute.gpuTypeId. Billable from creation for every Pod in the cluster, at
    the GPU type's hourly price times the total GPU count. The compute shape
    and type are fixed at creation; only the name can change later. The
    container configuration applies to every Pod, and templateId is the only
    way to use a private image; a bare registry property is rejected.
  createEndpoint: >-
    Create a Serverless endpoint. Billable while its workers run, at the
    worker's hourly price. Worker hardware is either the gpu object (gpu.pools
    takes Serverless pool ids such as ADA_24, and gpu.count sets GPUs per
    worker) or the cpu array of CPU flavor configurations. type and scaling
    are required and set the request-routing model. Workers cold-start on
    their first job, which commonly takes minutes.
  createPod: >-
    Create a GPU or CPU Pod. Billable from creation until it is stopped or
    terminated. GPU selection is the gpu object: gpu.id takes a GPU type id
    such as "NVIDIA GeForce RTX 4090", and gpu.count sets the number of GPUs.
    Cloud tier and data center choices limit which machines can host it.
  deleteCluster: >-
    Delete an Instant Cluster permanently. Every member Pod is terminated and
    its container disk is lost.
  deleteEndpoint: >-
    Delete a Serverless endpoint permanently and immediately.
  deletePod: >-
    Terminate a Pod permanently. Its container disk is lost; data on an
    attached network volume is kept. Stopping a Pod instead releases its
    compute but keeps its disk.
  deleteSecret: >-
    Delete a secret permanently. Environment variables that reference it
    ({{ RUNPOD_SECRET_<name> }}) stop resolving at the next Pod or worker
    boot; running instances keep the value they started with.
  deleteTemplate: >-
    Delete a template permanently. An endpoint that references the template
    can stop working once it is deleted.
  listServerlessBilling: >-
    Get Serverless billing history, split into time buckets. By default the
    response has one record per endpoint per bucket, which can be very large
    on accounts with many endpoints; lastN: 1 (or one bucket spanning the
    whole window) returns one record per endpoint, and serverlessId narrows it
    to a single endpoint. Pod billing is reported separately.
  updateEndpoint: >-
    Partially update a Serverless endpoint (PATCH): only fields present in the
    body change. gpu.pools and gpu.excludedTypes are one selection, so sending
    pools without excludedTypes clears existing exclusions; an exclusion
    naming a type outside pools returns 400, and a CUDA-only or count-only
    change does not need pools. Mutable fields: name, gpu, cpu, workers
    (min/max/idleTimeout), scaling (type plus queueDelay or requestCount),
    dataCenterIds, networkVolumes, timeout, flashboot, and the container
    settings (image, args, disk, ports, env, registry). cpu replaces a CPU
    endpoint's whole flavor selection. The compute family is fixed: gpu on a
    CPU endpoint, cpu on a GPU one, or both returns 400. Worker, scaling and
    timeout changes apply promptly; container changes (image, env) create a
    new release that rolls out as workers cycle, so in-flight workers keep the
    previous version.

# operationIds listed with their call shape only: top-level arguments with
# their types, nested objects collapsed. describe-tool serves the full schema,
# which still gates every call. For large request bodies that few sessions
# send, so every handshake stops carrying them. create-pod is among the
# most-called tools but joined once global mounts took it past 10 KB: one
# describe-tool call per session costs less than the schema on every
# handshake. The generator rejects an operationId absent from the spec.
schemaOnDemand:
  - createEndpoint
  - createPod
  - updateEndpoint
  - createCluster
  - updatePod
  - createTemplate
  - updateTemplate
  - createSecret
  - updateSecret

# Schema address -> argument description served instead of the spec's. The
# generator compacts every spec description (specgen/generator/prose.ts); list
# a field here when that cut loses a constraint an agent needs — above all the
# silent ones, where a call succeeds and does something other than intended.
# Addresses are DefName, DefName.prop, operationId.param or operationId.body;
# the generator rejects an address the spec no longer has.
propertyDescriptions:
  CreatePodRequest.templateId: >-
    ID of a pod template to base this pod on (not a serverless one). Its container settings (image, args,
    disk, ports, env, registry, persistent mount) fill in what this body
    omits; body fields win, and `env` merges per key with body winning. A
    CUDA field in `gpu` replaces the template's CUDA constraint; CPU pods
    ignore its mount. Copied once: later template edits do not affect the pod.
  CreateEndpointRequest.templateId: >-
    ID of a serverless template to base this endpoint on (must be
    serverless). Its container settings (image,
    args, disk, ports, env, registry) fill in what this body omits; body
    fields win, and `env` merges per key with body winning. Its
    allowedCudaVersions seeds `gpu.allowedCudaVersions` when the body omits
    it; pod-only flags are ignored. Copied once: later edits do not apply.
  UpdatePodRequest.templateId: >-
    ID of a pod template whose container settings (image, args, disk, ports,
    env, registry; not mounts) are applied as if sent in this PATCH body;
    explicit body fields win. `env` merges template and body per key (body
    wins) and replaces the pod's existing env. Applied once; must be a
    non-serverless template you can access.
  UpdateEndpointRequest.templateId: >-
    ID of a serverless template whose container settings (image, args, disk,
    ports, env, registry) are applied as if sent in this PATCH body; explicit
    body fields win. `env` merges template and body per key (body wins) and
    replaces the endpoint's existing env. Applied once; must be a serverless
    template you can access.
  CreateClusterRequest.templateId: >-
    ID of a pod template to provision every member pod from: it supplies the
    container settings (image, args, disk, env, ports) and the registry
    credential for private images — the only private-image path for clusters.
    Mutually exclusive with the inline container fields (`image`, `args`,
    `entrypoint`, `cmd`, `disk`, `env`, `ports`, `mounts`). Must be a
    non-serverless template you can access.
  CreatePodRequest.startSsh: >-
    Create-time flag: sets up SSH access by injecting a `PUBLIC_KEY`
    environment variable with your account's registered SSH keys
    (`update-ssh-keys`), unless the request sets one. With no registered keys
    it does nothing and the pod has no SSH access. Direct SSH also needs a
    `22/tcp` entry in `ports`.
  CreatePodRequest.startJupyter: >-
    Create-time flag: starts JupyterLab by injecting a generated
    `JUPYTER_PASSWORD` environment variable, unless the request sets one.
    Expose `8888/http` in `ports` to reach it.
  Mounts: >-
    Storage mounts for the pod: `persistent` (size + path) excludes both
    `network` and `global`; `network` (volumeId + path) and `global` (volumeId,
    optional path) take one entry each and can be combined. Every entry needs
    its full shape. On update, omit the field to leave the mounts as they are;
    the mount kind and a volume's volumeId cannot change, and mounts cannot be
    cleared.
  TemplateMounts: >-
    Storage mounts for containers from this template: a single `persistent`
    mount only (`network` is rejected). On update, omitting `mounts` or
    sending `{}` leaves the existing mount unchanged.
  BaseContainerConfig.args: >-
    The container's command as one raw string: a bare shell string is treated
    as CMD and split into arguments; a JSON object
    `{"entrypoint":[...],"cmd":[...]}` sets either or both. Send `""` to
    clear; omit to leave unchanged.
  BaseContainerConfig.cmd: >-
    Container CMD in exec form: when the image defines an ENTRYPOINT, the
    argument list passed to it. Encoded into `args`; supply both only when
    they describe the same command. Send `[]` to clear; omit to leave
    unchanged.
  BaseEndpointGpuConfig.pools: >-
    Serverless GPU pool IDs (the `pool` field of `list-gpu-types`). Workers
    are placed on whichever listed pool has capacity; narrow to specific cards
    with `excludedTypes`. On update, `pools` and `excludedTypes` are replaced
    together, so sending `pools` alone clears the exclusions.
  BaseEndpointGpuConfig.excludedTypes: >-
    GPU type IDs to subtract from the selected pools — the `id` field of
    `list-gpu-types`, the same identifiers pods take in `gpu.id`. Workers run
    on every type in `pools` except these; omit to use the whole pool. A value
    outside `pools` is rejected. On update, restate them whenever you send
    `pools`, or they are cleared.
  UpdateEndpointGpuConfig: >-
    Partial GPU update — every field is optional and an omitted one is left
    unchanged. `pools` is optional here, so a CUDA-only change does not resend
    the pool list; `excludedTypes` needs `pools` in the same request, and
    `pools` sent alone clears the exclusions.
  UpdateEndpointGpuConfig.allowedCudaVersions: >-
    Acceptable CUDA versions for worker placement, as `major.minor`. An
    explicit `[]` clears the constraint; omitting the field leaves it
    unchanged. A non-empty set cannot be sent with minCudaVersion, and setting
    one does not clear the other: clear the other explicitly in the same
    patch. Takes effect as workers are replaced.
  UpdateEndpointGpuConfig.minCudaVersion: >-
    Lowest acceptable CUDA version for worker placement, as `major.minor`. An
    explicit `""` clears the floor; omitting the field leaves it unchanged.
    Cannot be sent with a non-empty allowedCudaVersions (an explicit `[]`
    there is fine); clear that explicitly in the same patch if the endpoint
    carries one. Takes effect as workers are replaced.
