  /v2/catalog/templates:
    get:
      operationId: listPublicTemplates
      summary: List public templates
      description: |
        Returns the public template catalog. `source` selects which slice:
        `official` (the default) is Runpod-curated templates, `verified` is
        community templates Runpod has verified, and `community` is everything
        else other users have shared publicly. Both pod and serverless
        templates appear — use each entry's `serverless` flag to tell them
        apart. `registry` is always null for templates you don't own. Your own
        templates (public or private) are managed under `/v2/templates`; fetch
        any individual template — catalog or owned — via `/v2/templates/{id}`.

        At most 100 templates are returned. Pagination is not yet supported.
      tags:
        - Catalog
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum:
              - official
              - verified
              - community
            default: official
          description: |
            Which slice of the catalog to return: `official` for
            Runpod-curated templates (default), `verified` for
            Runpod-verified community templates, or `community` for all other
            publicly shared templates.
          example: official
      responses:
        "200":
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTemplatesResponse"
              examples:
                templates:
                  summary: Successful response
                  value:
                    templates:
                      - id: 30zmvf89kd
                        name: PyTorch 2.8
                        image: runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
                        args: ""
                        disk: 50
                        mounts: {}
                        ports:
                          - 8888/http
                          - 22/tcp
                        env: {}
                        registry: null
                        serverless: false
                        public: true
                        category: NVIDIA
                        startSsh: true
                        startJupyter: true
                        allowedCudaVersions: []
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        default:
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v2/billing:
    get:
      operationId: listBilling
      summary: Get aggregated billing history
      description: >
        Returns time-bucketed total spend across all billable Runpod resources
        for the authenticated user. Use startTime/endTime with bucketSize for an
        explicit range, or lastN with bucketSize for the most recent buckets.
        Each record reports one bucket's total plus pod, serverless, storage,
        public endpoint, and Instant Cluster cost components. The metadata block
        echoes the resolved query window, record count, and totals across all
        returned buckets.
      tags:
        - Billing
      parameters:
        - $ref: "#/components/parameters/BillingStartTime"
        - $ref: "#/components/parameters/BillingEndTime"
        - $ref: "#/components/parameters/BillingBucketSize"
        - $ref: "#/components/parameters/BillingLastN"
      responses:
        "200":
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListBillingResponse"
              examples:
                billing:
                  summary: Successful response
                  value:
                    records:
                      - startTime: 2026-06-01T00:00:00Z
                        endTime: 2026-06-02T00:00:00Z
                        totalAmount: 42.34
                        podGpuAmount: 18.2
                        podCpuAmount: 0
                        podDiskAmount: 1.1
                        serverlessGpuAmount: 12.6
                        serverlessCpuAmount: 0
                        serverlessDiskAmount: 0.44
                        serverlessFeeAmount: 1.25
                        storageStandardAmount: 0
                        storageHighPerformanceAmount: 2.5
                        endpointAmount: 3.21
                        clusterGpuAmount: 2.5
                        clusterDiskAmount: 0.3
                        clusterNetworkingAmount: 0.24
                    metadata:
                      query:
                        startTime: 2026-06-01T00:00:00Z
                        endTime: 2026-06-02T00:00:00Z
                        bucketSize: day
                      recordCount: 1
                      totals:
                        totalAmount: 42.34
                        podGpuAmount: 18.2
                        podCpuAmount: 0
                        podDiskAmount: 1.1
                        serverlessGpuAmount: 12.6
                        serverlessCpuAmount: 0
                        serverlessDiskAmount: 0.44
                        serverlessFeeAmount: 1.25
                        storageStandardAmount: 0
                        storageHighPerformanceAmount: 2.5
                        endpointAmount: 3.21
                        clusterGpuAmount: 2.5
                        clusterDiskAmount: 0.3
                        clusterNetworkingAmount: 0.24
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        default:
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
