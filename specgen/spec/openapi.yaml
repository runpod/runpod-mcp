      properties:
        proxy:
          description: Connection through Runpod's SSH proxy. Works without exposing a
            port and without a public IP, but carries an interactive shell only
            — SCP, SFTP, rsync, and port forwarding need `direct`. Null until
            the pod has a machine assignment.
          anyOf:
            - $ref: "#/components/schemas/PodSshEndpoint"
            - type: "null"
        direct:
          description: Connection straight to the pod's sshd over its published `22/tcp`
            mapping. Supports the full SSH feature set. Null unless `22/tcp` is
            in `ports` and the running pod has been assigned a public port for
            it — so it is absent while the pod is provisioning or stopped.
          anyOf:
            - $ref: "#/components/schemas/PodSshEndpoint"
            - type: "null"
    SshKeys:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: string
          description: The account's registered SSH public keys, one authorized_keys-style
            entry per element (`<type> <base64-key> [comment]`).
          examples:
            - - ssh-ed25519
                AAAAC3NzaC1lZDI1NTE5AAAAILXGDN/SclOozk1xsDztpmhGiKkkrfQB9SKoO8dSIQQZ
                me@example.com
    UpdateSshKeysRequest:
      type: object
      additionalProperties: false
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: string
            pattern: ^(ssh|ecdsa|sk)-[^\s]+ [^\s]+([ \t][^\n\r]*)?$
          description: |
            The full set of SSH public keys to register — this is a complete
            replacement, not a merge. Each entry is an authorized_keys-style
            line: `<type> <base64-key> [comment]`, e.g. from
            `~/.ssh/id_ed25519.pub`. Send `[]` to remove all keys. These keys
            are provisioned into pods created with `startSsh` and
            authenticate both SSH paths reported in the pod's `ssh` block.
          examples:
            - - ssh-ed25519
                AAAAC3NzaC1lZDI1NTE5AAAAILXGDN/SclOozk1xsDztpmhGiKkkrfQB9SKoO8dSIQQZ
                me@example.com
    Pod:
      allOf:
        - $ref: "#/components/schemas/ContainerConfig"
        - type: object
          required:
            - id
            - name
            - status
            - actions
            - image
            - args
            - disk
            - mounts
            - ports
            - env
            - registry
            - cloud
            - dataCenterId
            - cudaVersion
            - ssh
            - template
            - cost
            - locked
            - runtime
            - createdAt
            - startedAt
            - globalNetworking
          properties:
            id:
              type: string
              examples:
                - pod_abc123
            name:
              type: string
              examples:
                - my-training-pod
            status:
              $ref: "#/components/schemas/PodStatus"
            actions:
              type: array
              description: Valid state transitions for the current status.
              items:
                $ref: "#/components/schemas/PodAction"
            mounts:
              $ref: "#/components/schemas/Mounts"
            gpu:
              description: Present for GPU pods; omitted from CPU pods.
              allOf:
                - $ref: "#/components/schemas/GpuConfig"
            cpu:
              description: Present for CPU pods; omitted from GPU pods.
              allOf:
                - $ref: "#/components/schemas/CpuConfig"
            cloud:
              $ref: "#/components/schemas/Cloud"
            dataCenterId:
              type:
                - string
                - "null"
              description: Data center where the pod is running (assigned by scheduler)
              examples:
                - US-TX-3
            cudaVersion:
              type:
                - string
                - "null"
              description: CUDA version reported by the host machine. Retained while the pod
                is stopped — a stopped pod keeps its machine assignment and
                resumes onto the same host. Null means unknown or not applicable
                (CPU pods, or a host that has not reported one), not that CUDA
                is absent.
              examples:
                - "12.8"
            ssh:
              allOf:
                - $ref: "#/components/schemas/PodSsh"
              description: SSH connection details, via the Runpod proxy or directly to the
                pod's published `22/tcp` port.
            cluster:
              description: Cluster membership; omitted from a standalone pod. Member pods are
                managed through `/v2/clusters/{id}` — they are excluded from
                `GET /v2/pods` by default (pass `includeClusterPods=true` to
                include them) and cannot be modified or deleted via the pod
                endpoints.
              allOf:
                - $ref: "#/components/schemas/PodCluster"
            template:
              type:
                - string
                - "null"
              description: ID of the template this pod was created from
              examples:
                - null
            cost:
              type: number
              format: float
              description: Current cost in USD per hour (0.0 when EXITED or TERMINATED)
              examples:
                - 0.35
            locked:
              type: boolean
              description: Whether the pod is locked (prevents stopping or resetting)
              examples:
                - false
            globalNetworking:
              $ref: "#/components/schemas/PodGlobalNetworking"
            runtime:
              description: Live utilization metrics. Null when the pod is not RUNNING.
              anyOf:
                - $ref: "#/components/schemas/PodRuntime"
                - type: "null"
            createdAt:
              type: string
              format: date-time
              examples:
                - 2026-03-13T20:00:00Z
            startedAt:
              type:
                - string
                - "null"
              format: date-time
              examples:
                - 2026-03-13T20:00:00Z
    CreatePodRequest:
      allOf:
        - $ref: "#/components/schemas/ContainerConfig"
        - type: object
          required:
            - name
          description: |
            Request body for creating a pod. Exactly one of `gpu` or `cpu`
            must be set — enforced at the handler layer. For CPU pods, memory
            is derived by the API from the selected flavor's RAM multiplier;
            clients provide only CPU flavor and vCPU count. CPU pods support
            container disk and network volumes only; `mounts.persistent` is
            invalid when `cpu` is set.

            `image` is required unless `templateId` is set.
          properties:
            name:
              type: string
              minLength: 1
              examples:
                - my-training-pod
            cloud:
              allOf:
                - $ref: "#/components/schemas/Cloud"
              default: SECURE
              description: Cloud tier. Defaults to `SECURE` when omitted.
            cpu:
              $ref: "#/components/schemas/CreateCpuConfig"
            dataCenterIds:
              type: array
              items:
                type: string
              description: |
                Preferred data centers for placement. Omit or pass an empty
                array to let the scheduler choose.
              examples:
                - - US-TX-3
            globalNetworking:
              type: boolean
              default: false
              description: Enable global networking, giving the pod a private IP reachable
                across data centers. Requires an NVIDIA GPU and a
                global-networking-enabled data center (both enforced upstream).
                See `GET /v2/catalog/datacenters` (`globalNetwork`) for eligible
                data centers.
              examples:
                - false
            gpu:
              $ref: "#/components/schemas/CreateGpuConfig"
            mounts:
              $ref: "#/components/schemas/Mounts"
            startJupyter:
              type: boolean
              default: false
              description: |
                Create-time flag telling the provisioner to start JupyterLab:
                injects a generated `JUPYTER_PASSWORD` environment variable,
                unless the request already sets one. Only images that honor
                the convention start Jupyter from it (RunPod official images
                do); expose `8888/http` in `ports` to reach it.

                Not part of the pod's readable config — never returned by
                GET and not changeable by PATCH.
              examples:
                - true
            startSsh:
              type: boolean
              default: false
              description: |
                Create-time flag telling the provisioner to set up SSH
                access: injects a `PUBLIC_KEY` environment variable carrying
                your account's registered SSH public keys, unless the request
                already sets one. **Requires registered keys** (`PUT
                /v2/account/ssh-keys`) — with none registered the flag does
                nothing and the pod has no SSH access. Only images that honor
                the convention start sshd from it (all RunPod official images
                do). Connect using the pod's `ssh` block; the `ssh.direct`
                variant additionally needs a `22/tcp` entry in `ports`.

                Not part of the pod's readable config — never returned by
                GET and not changeable by PATCH.
              examples:
                - true
            templateId:
              type: string
              minLength: 1
              description: |
                ID of a pod template to base this pod on. The template is
                resolved at create time into the same container settings you
                could otherwise spread into this body (image, args, disk,
                ports, env, registry, persistent mount, startSsh,
                startJupyter, allowedCudaVersions); explicit body fields
                override the template's, except `env`, which is merged per
                key with body values winning. Sending either CUDA field
                (`gpu.allowedCudaVersions` or `gpu.minCudaVersion`) replaces
                the template's CUDA constraint entirely, and CPU pods ignore
                it (like the persistent mount). The template is a one-time
                source of settings: later template edits do not affect the
                pod, and the created pod does not retain a link to the
                template (`template` stays null). The template may be one
                of your own or a public catalog template — see
                `GET /v2/catalog/templates` (unknown or inaccessible ID →
                404) — and must not be a serverless template (→ 422). CPU
                pods do not inherit a template's persistent mount.
              examples:
                - 30zmvf89kd
      unevaluatedProperties: false
      if:
        not:
          required:
            - templateId
      then:
        required:
          - image
    UpdatePodRequest:
      allOf:
        - $ref: "#/components/schemas/ContainerConfig"
        - type: object
          properties:
            globalNetworking:
              type: boolean
              description: Enable (true) or disable (false) global networking. Takes effect on
                the next pod start/restart, not live. Requires an NVIDIA GPU and
                a global-networking-enabled data center (both enforced
                upstream). See `GET /v2/catalog/datacenters` (`globalNetwork`)
                for eligible data centers.
            locked:
              type: boolean
              description: Lock the pod (true) or unlock it (false). Locked pods cannot be
                stopped or reset.
            mounts:
              $ref: "#/components/schemas/Mounts"
            name:
              type: string
              minLength: 1
            templateId:
              type: string
              description: |
                ID of a pod template whose container settings are applied as
                if they were provided in this PATCH body (image, args, disk,
                ports, env, registry — mounts are not applied on update).
                Explicit body fields override the template's; `env` merges
                template and body per key (body wins) and, per PATCH
                semantics, replaces the pod's env. One-time application —
                no link to the template is retained. Must be one of your
                templates or a public template (unknown or inaccessible ID
                → 404); must not be a serverless template (→ 422).
              examples:
                - 30zmvf89kd
      unevaluatedProperties: false
    PodActionRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          $ref: "#/components/schemas/PodAction"
    ListPodsResponse:
      type: object
      required:
        - pods
      properties:
        pods:
          type: array
          items:
            $ref: "#/components/schemas/Pod"
    ClusterType:
      type: string
      description: Cluster type. TRAINING is the generic distributed-training cluster;
        SLURM provisions a managed Slurm controller/compute topology; RAY
        provisions a managed Ray head/worker topology; APPLICATION is a general
        multi-node application cluster.
      enum:
        - APPLICATION
        - TRAINING
        - SLURM
        - RAY
      examples:
        - TRAINING
    ClusterCompute:
      type: object
      additionalProperties: false
      description: "The homogeneous compute shape of a cluster. Every pod in the
        cluster is identical: `podCount` pods, each with `gpuCountPerPod` GPUs
        of type `gpuTypeId`. Total GPUs = `podCount` * `gpuCountPerPod`."
      required:
        - gpuTypeId
        - gpuCountPerPod
        - podCount
      properties:
        gpuTypeId:
          type: string
          minLength: 1
          description: GPU type for every pod in the cluster, as returned by GET
            /v2/catalog/gpus.
          examples:
            - NVIDIA H100 80GB HBM3
        gpuCountPerPod:
          type: integer
          minimum: 1
          description: Number of GPUs on each pod. Bounded above by the GPU type's
            per-cloud maximum (GpuType.maxCount); the upstream rejects values
            beyond it.
          examples:
            - 8
        podCount:
          type: integer
          minimum: 2
          maximum: 250
          description: Number of pods (nodes) in the cluster.
          examples:
            - 4
    PodClusterRole:
      type: string
      description: A cluster member's role. Assigned for SLURM and RAY clusters;
        omitted for TRAINING/APPLICATION members.
      enum:
        - SLURM_CONTROLLER
        - SLURM_COMPUTE
        - RAY_HEAD
        - RAY_WORKER
    PodCluster:
      type: object
      additionalProperties: false
      description: A pod's membership in a cluster.
      required:
        - id
        - rank
      properties:
        id:
          type: string
          description: ID of the cluster this pod belongs to.
          examples:
            - cluster_abc123
        rank:
          type:
            - integer
            - "null"
          description: The pod's node rank within the cluster (NODE_RANK), or null until
            the index is assigned during provisioning. Rank 0 is the cluster's
            entry node (`Cluster.primary`); for SLURM it is the controller.
          examples:
            - 0
        role:
          description: SLURM or RAY role; omitted for TRAINING/APPLICATION clusters, which
            do not assign roles.
          allOf:
            - $ref: "#/components/schemas/PodClusterRole"
        ip:
          type: string
          description: The pod's address on the cluster's private overlay network; omitted
            until the address is assigned.
          examples:
            - 10.65.0.2
    ClusterNetwork:
      type: object
      additionalProperties: false
      description: The cluster's private VXLAN overlay network (shared by all member pods).
      required:
        - cidr
      properties:
        cidr:
          type: string
          description: The overlay network's CIDR block.
          examples:
            - 10.65.0.0/16
        vxlanId:
          type: integer
          description: VXLAN network identifier; omitted until assigned.
          examples:
            - 42
        vxlanPort:
          type: integer
          description: UDP port carrying the VXLAN traffic; omitted until assigned.
          examples:
            - 4789
    ClusterPrimary:
      type: object
      additionalProperties: false
      description: The cluster's primary (master) node, through which the cluster is
        typically driven. Omitted until a primary pod has been placed.
      required:
        - podId
        - status
      properties:
        podId:
          type: string
          description: ID of the primary member pod.
          examples:
            - pod_node0
        status:
          $ref: "#/components/schemas/PodStatus"
        sshEndpoint:
          type: string
          description: Public SSH endpoint (`host:port`) for the primary node; omitted
            when the primary is not yet RUNNING or does not expose SSH (22/tcp).
          examples:
            - 1.2.3.4:22001
    ClusterPodsSummary:
      type: object
      additionalProperties: false
      description: A lightweight summary of a cluster's member pods. Use `GET
        /v2/clusters/{id}/pods` to retrieve the full pod objects.
      required:
        - total
        - byStatus
      properties:
        total:
          type: integer
          description: Number of member pods currently provisioned for the cluster.
          examples:
            - 4
        byStatus:
          type: object
          additionalProperties:
            type: integer
          description: Member pod counts keyed by pod status (the same values as
            `Pod.status`, e.g. RUNNING, PROVISIONING). Statuses with no pods are
            omitted.
          example:
            RUNNING: 3
            PROVISIONING: 1
    Cluster:
      type: object
      description: A cluster. Cluster-level fields describe the identity and
        homogeneous shape; `pods` is a lightweight summary of the members. Fetch
        the full member pods — with their container config, mounts, and runtime
        state — from `GET /v2/clusters/{id}/pods`.
      required:
        - id
        - name
        - type
        - compute
        - pods
        - createdAt
      properties:
        id:
          type: string
          examples:
            - cluster_abc123
        name:
          type: string
          examples:
            - my-training-cluster
        type:
          $ref: "#/components/schemas/ClusterType"
        compute:
          $ref: "#/components/schemas/ClusterCompute"
        template:
          type: string
          description: ID of the template this cluster's pods were created from; omitted
            when they were not created from one.
          examples:
            - tpl_abc
        dataCenterId:
          type: string
          description: Data center the cluster is placed in (a cluster is always within a
            single data center). Derived from the member pods; omitted until at
            least one pod is placed.
          examples:
            - US-TX-3
        pods:
          $ref: "#/components/schemas/ClusterPodsSummary"
        network:
          description: The cluster's overlay network; omitted until the network is
            provisioned.
          allOf:
            - $ref: "#/components/schemas/ClusterNetwork"
        primary:
          description: The primary (master) node; omitted until a primary pod is placed.
            Its `sshEndpoint` is omitted until that pod is RUNNING with SSH
            exposed.
          allOf:
            - $ref: "#/components/schemas/ClusterPrimary"
        createdAt:
          type: string
          format: date-time
          examples:
            - 2026-06-29T20:00:00Z
    CreateClusterRequest:
      allOf:
        - $ref: "#/components/schemas/BaseContainerConfig"
        - type: object
          required:
            - name
            - type
            - compute
          description: >
            Request body for creating a cluster. `compute` defines the

            homogeneous pod shape; the container configuration (image, env,
            ports,

            …) applies to every pod and can be spread from a template response.

            Private registries are not yet supported for clusters — there is no

            `registry` field here, unlike the other create requests.
          properties:
            compute:
              $ref: "#/components/schemas/ClusterCompute"
            name:
              type: string
              minLength: 1
              examples:
                - my-training-cluster
            type:
              $ref: "#/components/schemas/ClusterType"
            dataCenterIds:
              type: array
              items:
                type: string
              description: |
                Preferred data centers for placement. Omit or pass an empty
                array to let the scheduler choose. A cluster is always placed
                within a single data center.
              example:
                - US-TX-3
            mounts:
              $ref: "#/components/schemas/Mounts"
            startJupyter:
              type: boolean
              default: false
              description: Start Jupyter on every member pod, as on pod create.
            startSsh:
              type: boolean
              default: false
              description: "Provision SSH access on every member pod: injects a PUBLIC_KEY
                environment variable carrying your account's registered SSH
                public key. Same semantics as the pod create flag."
      unevaluatedProperties: false
    UpdateClusterRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Request body for updating a cluster. Only the cluster name can be
        changed — this endpoint is a rename. Compute shape, type, and container
        configuration are fixed at creation.
      properties:
        name:
          type: string
          minLength: 1
          examples:
            - renamed-cluster
    ListClustersResponse:
      type: object
      required:
        - clusters
      properties:
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
    Template:
      allOf:
        - $ref: "#/components/schemas/ContainerConfig"
        - type: object
          required:
            - id
            - name
            - image
            - args
            - disk
            - mounts
            - ports
            - env
            - registry
            - serverless
            - public
            - category
            - startSsh
            - startJupyter
            - allowedCudaVersions
          properties:
            id:
              type: string
              examples:
                - tpl_abc
            name:
              type: string
              examples:
                - My PyTorch Template
            mounts:
              $ref: "#/components/schemas/TemplateMounts"
            serverless:
              type: boolean
              description: Whether this template is for serverless workers (true) or pods
                (false)
              examples:
                - false
            public:
              type: boolean
              description: Whether this template is visible to other Runpod users
              examples:
                - false
            category:
              $ref: "#/components/schemas/TemplateCategory"
            startSsh:
              type: boolean
              description: Whether containers created from this template get SSH access
                provisioned at startup (`PUBLIC_KEY` env injection).
              examples:
                - true
            startJupyter:
              type: boolean
              description: Whether containers created from this template start JupyterLab at
                startup (`JUPYTER_PASSWORD` env injection).
              examples:
                - false
            allowedCudaVersions:
              type: array
              items:
                type: string
              description: Acceptable CUDA versions for containers created from this template,
                as `major.minor`. Empty means any version. Expanded into GPU pod
                and serverless endpoint creates; CPU pods ignore it.
              examples:
                - []
    CreateTemplateRequest:
      allOf:
        - $ref: "#/components/schemas/ContainerConfig"
        - type: object
          required:
            - name
            - image
          properties:
            name:
              type: string
              minLength: 1
              examples:
                - My PyTorch Template
            allowedCudaVersions:
              type: array
              items:
                type: string
                pattern: ^\d+\.\d+$
              description: |
                Acceptable CUDA versions for containers created from this
                template, as `major.minor`. Omit to accept any version — see
                the same field on `createPod` for matching semantics.
                Expanded into GPU pod and serverless endpoint creates; CPU
                pods ignore it.
              examples:
                - - "12.8"
                  - "12.6"
            category:
              description: Optional. Defaults to `NVIDIA` when omitted.
              allOf:
                - $ref: "#/components/schemas/TemplateCategory"
              default: NVIDIA
            mounts:
              $ref: "#/components/schemas/TemplateMounts"
            public:
              type: boolean
              default: false
            serverless:
              type: boolean
              default: false
            startJupyter:
              type: boolean
              default: true
              description: |
                Start JupyterLab in containers created from this template:
                injects a generated `JUPYTER_PASSWORD` environment variable,
                unless `env` already sets one. Only images that honor the
                convention start Jupyter from it (RunPod official images do);
                expose `8888/http` in `ports` to reach it. Defaults to `true`
                when omitted, matching console-created templates.
              examples:
                - false
            startSsh:
              type: boolean
              default: true
              description: |
                Provision SSH access in containers created from this template:
                injects a `PUBLIC_KEY` environment variable carrying the
                deployer's registered SSH public keys (`PUT
                /v2/account/ssh-keys` — with none registered the flag does
                nothing), unless `env` already sets one. Only images that
                honor the convention start sshd from it (all RunPod official
                images do); direct SSH also needs a `22/tcp` entry in
                `ports`. Defaults to `true` when omitted, matching
                console-created templates.
              examples:
                - true
      unevaluatedProperties: false
    UpdateTemplateRequest:
      allOf:
        - $ref: "#/components/schemas/ContainerConfig"
        - type: object
          properties:
            allowedCudaVersions:
              type: array
              items:
                type: string
                pattern: ^\d+\.\d+$
              description: Acceptable CUDA versions for pods created from this template. An
                explicit `[]` clears the constraint; omitting the field leaves
                it unchanged.
            category:
              $ref: "#/components/schemas/TemplateCategory"
            mounts:
              $ref: "#/components/schemas/TemplateMounts"
            name:
              type: string
              minLength: 1
            public:
              type: boolean
            serverless:
              type: boolean
            startJupyter:
              type: boolean
              description: Start JupyterLab at container startup (`JUPYTER_PASSWORD` env
                injection). See the create-time field for details.
            startSsh:
              type: boolean
              description: Provision SSH access at container startup (`PUBLIC_KEY` env
                injection). See the create-time field for details.
      unevaluatedProperties: false
    ListTemplatesResponse:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/Template"
    NetworkVolume:
      type: object
      required:
        - id
        - name
        - size
        - dataCenter
        - type
      properties:
        id:
          type: string
          description: Unique network volume identifier
          examples:
            - agv6w2qcg7
        name:
          type: string
          description: Human-readable name (not required to be unique)
          examples:
            - my-dataset
        size:
          type: integer
          minimum: 10
          maximum: 4096
          description: Allocated storage in GB
          examples:
            - 50
        dataCenter:
          type: string
          description: Data center location; immutable after creation
          examples:
            - EU-RO-1
        type:
          allOf:
            - $ref: "#/components/schemas/VolumeType"
          description: Storage tier of this volume. Set at creation and immutable.
    CreateNetworkVolumeRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - size
        - dataCenter
      properties:
        dataCenter:
          type: string
          minLength: 1
          description: Data center in which to create the volume
          examples:
            - EU-RO-1
        name:
          type: string
          minLength: 1
          description: Human-readable name
          examples:
            - my-dataset
        size:
          type: integer
          minimum: 10
          maximum: 4096
          description: Storage to allocate in GB
          examples:
            - 50
        type:
          allOf:
            - $ref: "#/components/schemas/VolumeType"
          description: |
            Storage tier for the volume. Optional. When omitted, the volume is
            provisioned using the requested data center's default (primary)
            storage tier. HIGH_PERFORMANCE provisions a high-performance (HPS)
            volume; STANDARD provisions a standard volume. A volume's tier is
            immutable after creation.
    UpdateNetworkVolumeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        Only the provided fields are updated. At least one field must be
        present; an empty body is rejected.
      properties:
        name:
          type: string
          minLength: 1
          description: New human-readable name
          examples:
            - renamed-volume
        size:
          type: integer
          minimum: 10
          maximum: 4096
          description: |
            New size in GB. Must be greater than or equal to the current size —
            network volume storage cannot be reduced.
          examples:
            - 100
    ListNetworkVolumesResponse:
      type: object
      required:
        - networkVolumes
      properties:
        networkVolumes:
          type: array
          items:
            $ref: "#/components/schemas/NetworkVolume"
    Registry:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          examples:
            - reg_abc
        name:
          type: string
          examples:
            - my-private-registry
    CreateRegistryRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - username
        - password
      properties:
        name:
          type: string
          minLength: 1
          examples:
            - my-private-registry
        password:
          type: string
          minLength: 1
          description: Registry password (write-only, not returned in responses)
        username:
          type: string
          minLength: 1
          description: Registry username (write-only, not returned in responses)
    ListRegistriesResponse:
      type: object
      required:
        - registries
      properties:
        registries:
          type: array
          items:
            $ref: "#/components/schemas/Registry"
    EcrDelegation:
      type: object
      required:
        - id
        - delegatorUserId
        - awsUser
        - repository
        - tag
        - awsRegion
        - createdAt
      properties:
        id:
          type: string
          description: Delegation identifier
          examples:
            - deleg_abc123
        name:
          type:
            - string
            - "null"
          description: Optional name for the delegation
          examples:
            - my-delegation
        delegatorUserId:
          type: string
          description: User ID that created the delegation
          examples:
            - user_xyz
        awsUser:
          type: string
          description: AWS user/role being delegated
          examples:
            - "123456789"
        repository:
          type: string
          description: ECR repository name
          examples:
            - runpod/deployment
        tag:
          type: string
          description: ECR image tag
          examples:
            - latest
        awsRegion:
          type: string
          description: AWS region
          examples:
            - us-east-2
        dockerRegistryUri:
          type: string
          description: Formatted ECR registry URI for Docker login
          examples:
            - 123456789.dkr.ecr.us-east-2.amazonaws.com
        createdAt:
          type: string
          format: date-time
          description: When the delegation was created
          examples:
            - 2026-03-13T20:00:00Z
    CreateDelegationRequest:
      type: object
      additionalProperties: false
      required:
        - resource
      properties:
        resource:
          type: string
          description: ECR resource ARN
          examples:
            - arn:aws:ecr:us-east-2:418399314813:repository/runpod/deployment
        name:
          type:
            - string
            - "null"
          description: Optional name for the delegation
          examples:
            - my-delegation
    ListDelegationsResponse:
      type: object
      required:
        - delegations
      properties:
        delegations:
          type: array
          items:
            $ref: "#/components/schemas/EcrDelegation"
    GpuManufacturer:
      type: string
      description: Canonical GPU hardware manufacturer.
      x-enum-varnames:
        - GpuManufacturerNVIDIA
        - GpuManufacturerAMD
        - GpuManufacturerUNKNOWN
      enum:
        - NVIDIA
        - AMD
        - UNKNOWN
    GpuType:
      type: object
      required:
        - id
        - name
        - pool
        - manufacturer
        - memory
        - secure
        - community
        - price
        - maxCount
      properties:
        id:
          type: string
          description: Individual GPU type identifier (use for pod creation)
          examples:
            - NVIDIA GeForce RTX 4090
        name:
          type: string
          examples:
            - RTX 4090
        pool:
          type:
            - string
            - "null"
          description: Serverless GPU pool ID (use for serverless endpoint creation). Null
            if GPU is not in a serverless pool.
          examples:
            - ADA_24
        manufacturer:
          $ref: "#/components/schemas/GpuManufacturer"
        memory:
          type: integer
          description: VRAM in GB
          examples:
            - 24
        secure:
          type: boolean
          description: Available on secure cloud
          examples:
            - true
        community:
          type: boolean
          description: Available on community cloud
          examples:
            - true
        price:
          type: object
          description: |
            List price in USD per hour for a **single** GPU of this type. Pod
            rates are quoted separately per cloud (`secure`, `community`);
            `serverless` is the rate for this GPU's pool. In every case the
            rate for a unit is the figure times `gpu.count`; the rate actually
            billed for a pod is reported as `cost` on the pod itself.
          required:
            - secure
            - community
          properties:
            secure:
              type: number
              format: float
              examples:
                - 0.44
            community:
              type: number
              format: float
              examples:
                - 0.31
            serverless:
              type: number
              format: float
              description: |
                Serverless list price per GPU per hour, from the `pool` this GPU
                belongs to. Multiply by `gpu.count` for the per-worker rate.
                Absent when the GPU is not in a serverless pool available to the
                caller. Negotiated account discounts are not reflected.
              examples:
                - 1.1
        maxCount:
          type: object
          description: |
            The largest number of GPUs you can request on a single pod of this
            type, quoted separately per cloud. A pod runs on one machine, so
            this is the GPU count of the largest machine of this type Runpod
            operates in that cloud.

            This is a ceiling, not a stock level — it does not mean that many
            GPUs are free right now. For current availability, request
            `include=AVAILABILITY&product=POD` and read `availability`
            (overall) or `dataCenters` (per data center).
          required:
            - secure
            - community
          properties:
            secure:
              type: integer
              examples:
                - 8
            community:
              type: integer
              examples:
                - 4
        availability:
          description: Overall GPU availability for the requested `product` contexts.
            Present only when requested with include=AVAILABILITY, which also
            requires `product`.
          $ref: "#/components/schemas/AvailabilityLevel"
        dataCenters:
          type: array
          description: |
            Per-datacenter GPU availability for the requested `product`
            contexts, listing only the datacenters that offer this GPU in the
            requested configuration. Present only when requested with
            include=AVAILABILITY, which also requires `product`, and omitted
            entirely when the configuration is unavailable everywhere.
          items:
            $ref: "#/components/schemas/DataCenterAvailability"
        cudaVersions:
          type: array
          description: |
            CUDA versions offered by machines with this GPU type, each tagged
            with current capacity. Present only when requested with
            include=AVAILABILITY, and scoped by the same filters as
            `availability` (`count`, `cloud`, `product`, and whichever of
            `cudaVersions` / `minCudaVersion` was supplied).

            Machines that report no CUDA version are skipped, so this property
            is absent entirely for a GPU type with none — AMD, for instance.
            Treat a missing `cudaVersions` the same as an empty one. A version
            absent from a populated list is not offered for this GPU type.
          items:
            $ref: "#/components/schemas/CudaVersionAvailability"
    AvailabilityLevel:
      type: string
      description: Catalog stock availability level.
      enum:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
    Product:
      type: string
      description: Catalog product availability context. Availability is
        product-specific, so this is required whenever availability is
        requested.
      enum:
        - POD
        - CLUSTER
        - SERVERLESS
    CpuProduct:
      type: string
      description: CPU catalog product availability context. Availability is
        product-specific, so this is required whenever availability is
        requested.
      enum:
        - POD
        - SERVERLESS
    CatalogInclude:
      type: string
      description: Catalog include expansion. Only AVAILABILITY is supported today;
        additional include values may be added in the future.
      enum:
        - AVAILABILITY
    DataCenterInclude:
      type: string
      description: Data center catalog availability expansion.
      enum:
        - GPU_AVAILABILITY
        - CPU_AVAILABILITY
    GpuCloudFilter:
      type: string
      description: GPU availability cloud filter.
      enum:
        - SECURE
        - COMMUNITY
    VolumeType:
      type: string
      description: Data center network volume storage type.
      enum:
        - STANDARD
        - HIGH_PERFORMANCE
    CatalogResourceAvailability:
      type: object
      required:
        - id
        - name
        - availability
      properties:
        id:
          type: string
          description: Catalog resource identifier.
          examples:
            - NVIDIA GeForce RTX 4090
        name:
          type: string
          description: Human-readable catalog resource name.
          examples:
            - RTX 4090
        availability:
          $ref: "#/components/schemas/AvailabilityLevel"
    DataCenterAvailability:
      type: object
      required:
        - id
        - name
        - availability
      properties:
        id:
          type: string
          description: Data center identifier.
          examples:
            - US-CA-2
        name:
          type: string
          description: Human-readable data center name.
          examples:
            - US California 2
        availability:
          $ref: "#/components/schemas/AvailabilityLevel"
    CudaVersionAvailability:
      type: object
      required:
        - version
        - available
      properties:
        version:
          type: string
          pattern: ^\d+\.\d+$
          description: CUDA version as `major.minor`, suitable for
            `gpu.allowedCudaVersions` on pod create.
          examples:
            - "12.8"
        available:
          type: boolean
          description: True when at least one machine on this CUDA version has free
            capacity now. False means the version is offered for this GPU type
            but is currently full, so a pod constrained to it will fail on
            capacity.
          examples:
            - true
    ListGpuTypesResponse:
      type: object
      required:
        - gpus
      properties:
        gpus:
          type: array
          items:
            $ref: "#/components/schemas/GpuType"
    CpuType:
      type: object
      required:
        - id
        - name
        - group
        - vcpu
        - ramGbPerVcpu
        - price
      properties:
        id:
          type: string
          description: CPU flavor identifier (use in cpu.id for pod creation)
          examples:
            - cpu5c
        name:
          type: string
          description: Human-readable flavor name
          examples:
            - Compute-Optimized
        group:
          type: string
          description: CPU generation group
          examples:
            - Gen 5
        vcpu:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
              examples:
                - 2
            max:
              type: integer
              examples:
                - 32
        ramGbPerVcpu:
          type: number
          format: float
          description: |
            GB of RAM allocated per vCPU. Multiply by the chosen vCPU
            count (within `vcpu.min`..`vcpu.max`) to get the total RAM
            for an instance of this flavor. May be fractional.
          examples:
            - 2.5
        price:
          type: object
          required:
            - securePerVcpu
            - serverlessPerVcpu
          properties:
            securePerVcpu:
              type: number
              format: float
              description: |
                Price for secure pods per vCPU. Multiply by the chosen vCPU
                count (within `vcpu.min`..`vcpu.max`) to get the total price.
              examples:
                - 0.04
            serverlessPerVcpu:
              type: number
              format: float
              description: |
                Price for serverless per vCPU. Multiply by the chosen vCPU
                count (within `vcpu.min`..`vcpu.max`) to get the total price.
              examples:
                - 0.03
        availability:
          description: Overall CPU availability for the requested `product` contexts.
            Present only when requested with include=AVAILABILITY, which also
            requires `product`.
          $ref: "#/components/schemas/AvailabilityLevel"
        dataCenters:
          type: array
          description: |
            Per-datacenter CPU availability for the requested `product`
            contexts, listing only the datacenters that offer this CPU flavor.
            Present only when requested with include=AVAILABILITY, which also
            requires `product`, and omitted entirely when the flavor is
            unavailable everywhere.
          items:
            $ref: "#/components/schemas/DataCenterAvailability"
    ListCpuTypesResponse:
      type: object
      required:
        - cpus
      properties:
        cpus:
          type: array
          items:
            $ref: "#/components/schemas/CpuType"
    DataCenter:
      type: object
      required:
        - id
        - name
        - region
        - networkVolumeTypes
        - compliance
        - globalNetwork
      properties:
        id:
          type: string
          examples:
            - US-TX-3
        name:
          type: string
          examples:
            - US Texas 3
        region:
          $ref: "#/components/schemas/DataCenterRegion"
        globalNetwork:
          type: boolean
          description: Whether this data center supports global networking (private
            cross-datacenter pod-to-pod network).
          examples:
            - true
        networkVolumeTypes:
          type: array
          items:
            $ref: "#/components/schemas/VolumeType"
          description: Network volume tiers this DC supports. Empty = none.
        compliance:
          type: array
          description: Compliance certifications held by this data center
          items:
            $ref: "#/components/schemas/Compliance"
          examples:
            - - GDPR
              - ISO_IEC_27001
              - SOC_2_TYPE_2
        gpuAvailability:
          type: array
          description: |
            Availability of each GPU this data center offers. Present only when
            requested with include=GPU_AVAILABILITY, and omitted entirely when
            the data center offers no GPUs.
          items:
            $ref: "#/components/schemas/CatalogResourceAvailability"
        cpuAvailability:
          type: array
          description: |
            Availability of each CPU flavor this data center offers. Present
            only when requested with include=CPU_AVAILABILITY, and omitted
            entirely when the data center offers no CPU flavors.
          items:
            $ref: "#/components/schemas/CatalogResourceAvailability"
    DataCenterRegion:
      type: string
      description: Continental region containing the data center.
      examples:
        - EUROPE
      enum:
        - NORTH_AMERICA
        - SOUTH_AMERICA
        - EUROPE
        - ASIA
        - MIDDLE_EAST
        - AFRICA
        - OCEANIA
        - ANTARCTICA
        - UNKNOWN
    Compliance:
      type: string
      description: Compliance certifications.
      enum:
        - GDPR
        - ISO_IEC_27001
        - ISO_14001
        - PCI_DSS
        - HITRUST
        - SOC_1_TYPE_2
        - SOC_2_TYPE_2
        - SOC_3_TYPE_2
        - ITAR
        - FISMA_HIGH
        - HIPAA
        - RENEWABLE
    ListDataCentersResponse:
      type: object
      required:
        - dataCenters
      properties:
        dataCenters:
          type: array
          items:
            $ref: "#/components/schemas/DataCenter"
    BillingTimeRange:
      type: object
      description: >
        Half-open time range [startTime, endTime) in RFC 3339. On a record it is
        the time bucket; on a query echo it is the resolved window.
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          format: date-time
          description: Start of the range, inclusive (RFC 3339).
          examples:
            - 2026-06-01T00:00:00Z
        endTime:
          type: string
          format: date-time
          description: End of the range, exclusive (RFC 3339).
          examples:
            - 2026-06-02T00:00:00Z
    BillingBucketSize:
      type: string
      enum:
        - hour
        - day
        - week
        - month
        - year
      x-enum-varnames:
        - BillingBucketSizeHour
        - BillingBucketSizeDay
        - BillingBucketSizeWeek
        - BillingBucketSizeMonth
        - BillingBucketSizeYear
      default: day
      description: Length of each billing time bucket.
      examples:
        - day
    BillingAmounts:
      type: object
      description: >
        Total spend across all billable Runpod resources with each cost
        component broken out, fully prefixed by resource. Backs the aggregate
        record's amounts and the metadata totals.
      required:
        - totalAmount
        - podGpuAmount
        - podCpuAmount
        - podDiskAmount
        - serverlessGpuAmount
        - serverlessCpuAmount
        - serverlessDiskAmount
        - serverlessFeeAmount
        - storageStandardAmount
        - storageHighPerformanceAmount
        - endpointAmount
        - clusterGpuAmount
        - clusterDiskAmount
        - clusterNetworkingAmount
      properties:
        totalAmount:
          type: number
          format: double
          description: Total cost in USD for the bucket across all resources.
          examples:
            - 42.34
        podGpuAmount:
          type: number
          format: double
          description: GPU pod compute cost in USD for the bucket.
        podCpuAmount:
          type: number
          format: double
          description: CPU pod compute cost in USD for the bucket.
        podDiskAmount:
          type: number
          format: double
          description: Pod disk cost in USD for the bucket.
        serverlessGpuAmount:
          type: number
          format: double
          description: Serverless GPU compute cost in USD for the bucket.
        serverlessCpuAmount:
          type: number
          format: double
          description: Serverless CPU compute cost in USD for the bucket.
        serverlessDiskAmount:
          type: number
          format: double
          description: Serverless disk cost in USD for the bucket.
        serverlessFeeAmount:
          type: number
          format: double
          description: Serverless platform fee in USD for the bucket.
        storageStandardAmount:
          type: number
          format: double
          description: Standard network volume storage cost in USD for the bucket.
        storageHighPerformanceAmount:
          type: number
          format: double
          description: High-performance network volume storage cost in USD for the bucket.
        endpointAmount:
          type: number
          format: double
          description: Runpod public endpoint cost in USD for the bucket.
        clusterGpuAmount:
          type: number
          format: double
          description: Cluster GPU compute cost in USD for the bucket.
        clusterDiskAmount:
          type: number
          format: double
          description: Cluster disk cost in USD for the bucket.
        clusterNetworkingAmount:
          type: number
          format: double
          description: Cluster inter-node networking cost in USD for the bucket.
    BillingRecord:
      description: >
        A single time-bucketed record of total spend across all billable Runpod
        resources, with each cost component broken out. Returned by GET
        /v2/billing.
      allOf:
        - $ref: "#/components/schemas/BillingTimeRange"
        - $ref: "#/components/schemas/BillingAmounts"
    PodBillingAmounts:
      type: object
      description: >
        Pod cost components covering both GPU and CPU pods. Backs a record's
        amounts and the metadata totals.
      required:
        - totalAmount
        - gpuAmount
        - cpuAmount
        - diskAmount
      properties:
        totalAmount:
          type: number
          format: double
          description: Total pod cost in USD for the bucket.
          examples:
            - 12.34
        gpuAmount:
          type: number
          format: double
          description: GPU pod compute cost in USD for the bucket.
        cpuAmount:
          type: number
          format: double
          description: CPU pod compute cost in USD for the bucket.
        diskAmount:
          type: number
          format: double
          description: Pod disk cost in USD for the bucket.
    PodBillingRecord:
      description: >
        A single time-bucketed pod billing record, covering both GPU and CPU
        pods. Returned by GET /v2/billing/pods.
      allOf:
        - $ref: "#/components/schemas/BillingTimeRange"
        - $ref: "#/components/schemas/PodBillingAmounts"
        - type: object
          required:
            - podId
          properties:
            podId:
              type: string
              description: >
                The pod this record bills. When the podId filter is set every
                record carries that id; otherwise one record is emitted per pod
                per bucket.
              examples:
                - pod_abc123
    ServerlessBillingAmounts:
      type: object
      description: >
        Serverless cost components. Backs a record's amounts and the metadata
        totals.
      required:
        - totalAmount
        - gpuAmount
        - cpuAmount
        - diskAmount
        - feeAmount
      properties:
        totalAmount:
          type: number
          format: double
          description: Total serverless cost in USD for the bucket.
          examples:
            - 8.9
        gpuAmount:
          type: number
          format: double
          description: Serverless GPU compute cost in USD for the bucket.
        cpuAmount:
          type: number
          format: double
          description: Serverless CPU compute cost in USD for the bucket.
        diskAmount:
          type: number
          format: double
          description: Serverless disk cost in USD for the bucket.
        feeAmount:
          type: number
          format: double
          description: Serverless platform fee in USD for the bucket.
    ServerlessBillingRecord:
      description: >
        A single time-bucketed serverless billing record. Returned by GET
        /v2/billing/serverless.
      allOf:
        - $ref: "#/components/schemas/BillingTimeRange"
        - $ref: "#/components/schemas/ServerlessBillingAmounts"
        - type: object
          required:
            - serverlessId
          properties:
            serverlessId:
              type: string
              description: >
                The serverless endpoint this record bills. When the serverlessId
                filter is set every record carries that id; otherwise one record
                is emitted per serverless endpoint per bucket.
              examples:
                - ep_abc123
    EndpointBillingAmounts:
      type: object
      description: >
        Runpod public endpoint cost. Backs a record's amounts and the metadata
        totals.
      required:
        - totalAmount
      properties:
        totalAmount:
          type: number
          format: double
          description: Total public endpoint cost in USD for the bucket.
          examples:
            - 3.21
    EndpointBillingRecord:
      description: >
        A single time-bucketed Runpod public endpoint billing record. Returned
        by GET /v2/billing/endpoints.
      allOf:
        - $ref: "#/components/schemas/BillingTimeRange"
        - $ref: "#/components/schemas/EndpointBillingAmounts"
    NetworkVolumeBillingAmounts:
      type: object
      description: >
        Network volume storage cost, split into standard and high-performance.
        Backs a record's amounts and the metadata totals.
      required:
        - totalAmount
        - standardAmount
        - highPerformanceAmount
      properties:
        totalAmount:
          type: number
          format: double
          description: >
            Total network volume cost in USD for the bucket, across standard and
            high-performance storage.
          examples:
            - 5.79
        standardAmount:
          type: number
          format: double
          description: Standard storage cost in USD for the bucket.
        highPerformanceAmount:
          type: number
          format: double
          description: High-performance storage cost in USD for the bucket.
    NetworkVolumeBillingRecord:
      description: >
        A single time-bucketed network volume billing record, split into
        standard and high-performance storage. Returned by GET
        /v2/billing/network-volumes.
      allOf:
        - $ref: "#/components/schemas/BillingTimeRange"
        - $ref: "#/components/schemas/NetworkVolumeBillingAmounts"
        - type: object
          required:
            - networkVolumeId
          properties:
            networkVolumeId:
              type: string
              description: >
                The network volume this record bills. When the networkVolumeId
                filter is set every record carries that id; otherwise one record
                is emitted per network volume per bucket.
              examples:
                - vol_abc123
    ClusterBillingAmounts:
      type: object
      description: >
        Cluster cost components (GPU-only, no CPU). Backs a record's amounts and
        the metadata totals.
      required:
        - totalAmount
        - gpuAmount
        - diskAmount
        - networkingAmount
      properties:
        totalAmount:
          type: number
          format: double
          description: Total Instant Cluster cost in USD for the bucket.
          examples:
            - 99
        gpuAmount:
          type: number
          format: double
          description: Cluster GPU compute cost in USD for the bucket.
        diskAmount:
          type: number
          format: double
          description: Cluster disk cost in USD for the bucket.
        networkingAmount:
          type: number
          format: double
          description: Cluster inter-node networking cost in USD for the bucket.
    ClusterBillingRecord:
      description: >
        A single time-bucketed cluster billing record; clusters are GPU-only (no
        CPU component). Returned by GET /v2/billing/clusters.
      allOf:
        - $ref: "#/components/schemas/BillingTimeRange"
        - $ref: "#/components/schemas/ClusterBillingAmounts"
        - type: object
          required:
            - clusterId
          properties:
            clusterId:
              type: string
              description: >
                The cluster this record bills. When the clusterId filter is set
                every record carries that id; otherwise one record is emitted
                per cluster per bucket.
              examples:
                - cluster_abc123
    BillingQuery:
      description: Resolved query window and granularity (routes without a filter).
      allOf:
        - $ref: "#/components/schemas/BillingTimeRange"
        - type: object
          required:
            - bucketSize
          properties:
            bucketSize:
              $ref: "#/components/schemas/BillingBucketSize"
    PodBillingQuery:
      allOf:
        - $ref: "#/components/schemas/BillingQuery"
        - type: object
          properties:
            podId:
              type:
                - string
                - "null"
              description: The podId filter applied, if any.
    ServerlessBillingQuery:
      allOf:
        - $ref: "#/components/schemas/BillingQuery"
        - type: object
          properties:
            serverlessId:
              type:
                - string
                - "null"
              description: The serverlessId filter applied, if any.
    NetworkVolumeBillingQuery:
      allOf:
        - $ref: "#/components/schemas/BillingQuery"
        - type: object
