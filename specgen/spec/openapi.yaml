  /v2/catalog/datacenters:
    get:
      operationId: listDataCenters
      summary: List data centers
      description: >
        Returns available data center locations with region, compliance,
        supported network volume tiers, and global networking support. Use
        include=GPU_AVAILABILITY or include=CPU_AVAILABILITY to add per-resource
        availability arrays to each data center. The regions,
        networkVolumeTypes, compliance, and globalNetwork query parameters
        filter the list before it is returned.
      tags:
        - Catalog
      parameters:
        - name: include
          in: query
          required: false
          description: "Comma-separated optional expansions. Supported value:
            GPU_AVAILABILITY, CPU_AVAILABILITY."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DataCenterInclude"
            example:
              - GPU_AVAILABILITY
        - name: regions
          in: query
          required: false
          description: Comma-separated DataCenterRegion enum values. Values within this
            filter use OR semantics. Different filter families combine with AND.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/DataCenterRegion"
            example:
              - EUROPE
              - ASIA
        - name: networkVolumeTypes
          in: query
          required: false
          description: "Comma-separated volume types. Supported values: STANDARD,
            HIGH_PERFORMANCE. Values within this filter use AND semantics;
            volumes=STANDARD,HIGH_PERFORMANCE requires both storage types.
            Different filter families combine with AND."
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/VolumeType"
            example:
              - STANDARD
              - HIGH_PERFORMANCE
        - name: compliance
          in: query
          required: false
          description: Comma-separated Compliance enum values. Values within this filter
            use AND semantics; compliance=GDPR,SOC_2_TYPE_2 requires both
            certifications. Different filter families combine with AND.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Compliance"
            example:
              - GDPR
              - SOC_2_TYPE_2
        - name: globalNetwork
          in: query
          required: false
          description: Filter by global networking support. true returns only data centers
            that support global networking; false only those that do not.
            Different filter families combine with AND.
          schema:
            type: boolean
          example: true
      responses:
        "200":
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDataCentersResponse"
              examples:
                dataCenters:
                  summary: Successful response
                  value:
                    dataCenters:
                      - id: US-KS-2
                        name: US Kansas 2
                        region: NORTH_AMERICA
                        globalNetwork: true
                        networkVolumeTypes:
                          - STANDARD
                          - HIGH_PERFORMANCE
                        compliance:
                          - SOC_2_TYPE_2
                          - ISO_IEC_27001
                        gpuAvailability:
                          - id: NVIDIA GeForce RTX 4090
                            name: RTX 4090
                            availability: HIGH
                        cpuAvailability:
                          - id: cpu3c-2-4
                            name: Compute-Optimized
                            availability: MEDIUM
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        default:
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
