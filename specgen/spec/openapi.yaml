# Vendored from https://api.runpod.io/v2/openapi.json (the PRODUCTION spec
# generation). The dev host v2-rest.runpod.dev serves a different generation
# with different paths (/v2/gpu-types vs /v2/catalog/gpus) — do not pull from
# it for a production deployment.
openapi: 3.1.0
info:
  title: Runpod REST API
  version: 2.0.0
  description: Runpod public REST API — v2
servers:
  - url: https://api.runpod.io
    description: Runpod API v2 production server
security:
  - bearerAuth: []
tags:
  - name: Account
    description: Account-scoped settings and primitives (SSH public keys).
  - name: Pods
    description: GPU and CPU pod lifecycle, configuration, actions, and log streaming.
  - name: Serverless
    description: Serverless endpoint lifecycle, worker visibility, releases, and
      worker log streaming.
  - name: Templates
    description: Reusable pod and endpoint configuration templates.
  - name: Network Volumes
    description: Persistent network storage volumes for workloads.
  - name: Registries
    description: Container registry credentials used to pull private images.
  - name: Catalog
    description: Available GPU, CPU, data center, and public template catalog metadata.
  - name: Billing
    description: Billing history and usage cost records across resource types.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Runpod API Key
      description: >
        Runpod API key authentication. Generate an API key in the Runpod console
        and send it in the `Authorization` header as `Bearer <api_key>`. Keys
        are scoped to the permissions granted when created; requests may return
        `403` when a valid key lacks access to the requested resource or action.
  responses:
    UnauthorizedError:
      description: Authentication failed because the bearer token is missing,
        malformed, expired, or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingBearerToken:
              summary: Missing bearer token
              value:
                title: Unauthorized
                status: 401
                detail: missing bearer token
    ForbiddenError:
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
      description: The bearer token is valid, but it does not grant access to the
        requested resource or action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            insufficientAccess:
              summary: Insufficient access
              value:
                title: Forbidden
                status: 403
                detail: access denied
    BadRequestError:
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
      description: The request could not be processed because it is malformed or
        conflicts with request rules.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            badRequest:
              summary: Bad request
              value:
                title: Bad Request
                status: 400
                detail: request could not be processed
    NotFoundError:
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
      description: The requested resource was not found or is not accessible to the caller.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              summary: Resource not found
              value:
                title: Not Found
                status: 404
                detail: resource not found
    UnprocessableEntityError:
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
      description: The request body or parameters were syntactically valid but failed
        validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validationFailed:
              summary: Validation failed
              value:
                title: Unprocessable Entity
                status: 422
                detail: Request validation failed.
    MethodNotAllowedError:
      description: The request method is not supported for the target path.
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
        Allow:
          description: Comma-separated methods supported by the target path.
          schema:
            type: string
          example: GET, POST
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            methodNotAllowed:
              summary: Method not allowed
              value:
                title: Method Not Allowed
                status: 405
                detail: The requested method is not allowed for this path.
    TooManyRequestsError:
      description: >
        The caller exceeded its per-user rate limit. The response identifies the
        window that was exceeded and how long to wait. The `RateLimit` and
        `RateLimit-Policy` headers (per the IETF ratelimit-headers draft) also
        accompany successful responses, so clients can track quota before a 429.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, per the exceeded window.
          schema:
            type: integer
          example: 12
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            rateLimited:
              summary: Rate limit exceeded
              value:
                title: Too Many Requests
                status: 429
                detail: rate limit exceeded for the minute window
  headers:
    RateLimit:
      schema:
        $ref: "#/components/schemas/RateLimitHeader"
    RateLimit-Policy:
      schema:
        $ref: "#/components/schemas/RateLimitPolicyHeader"
  parameters:
    BillingStartTime:
      name: startTime
      in: query
      required: false
      description: >
        Start of the billing period (RFC 3339). Defaults to 30 days ago. Snapped
        down to the start of its bucketSize bucket so the window aligns with the
        returned records; provide a boundary-aligned value (e.g. midnight for
        bucketSize=day) to avoid widening.
      schema:
        type: string
        format: date-time
      example: 2026-05-01T00:00:00Z
    BillingEndTime:
      name: endTime
      in: query
      required: false
      description: >
        End of the billing period (RFC 3339), exclusive. Defaults to now.
        Snapped up to the end of the bucketSize bucket it lands in (unless
        already on a boundary) so the window aligns with the returned records.
      schema:
        type: string
        format: date-time
      example: 2026-06-01T00:00:00Z
    BillingBucketSize:
      name: bucketSize
      in: query
      required: false
      description: Length of each billing time bucket. Defaults to day.
      schema:
        $ref: "#/components/schemas/BillingBucketSize"
    BillingLastN:
      name: lastN
      in: query
      required: false
      description: >
        Return the last N buckets of bucketSize, ending with the current
        (in-progress) bucket — e.g. lastN=100 with bucketSize=day is "last 100
        days". The resolved window is aligned to bucket boundaries: startTime is
        the start of the earliest bucket (e.g. midnight of the earliest day) and
        endTime is the end of the current bucket. Mutually exclusive with
        startTime/endTime; provide one or the other, not both.
      schema:
        type: integer
        minimum: 1
      example: 30
    CatalogIncludeParam:
      name: include
      in: query
      required: false
      description: "Comma-separated optional expansions. Supported value today:
        AVAILABILITY. This may expand with more include values in the future."
      style: form
      explode: false
      schema:
        type: array
        maxItems: 1
        items:
          $ref: "#/components/schemas/CatalogInclude"
      example:
        - AVAILABILITY
    GpuProductFilter:
      name: product
      in: query
      required: false
      description: "Comma-separated availability product contexts. Supported values:
        POD, CLUSTER, SERVERLESS. Required with include=AVAILABILITY, and valid
        only with it (400 either way). There is no default: the same GPU type
        can be scarce for pods and plentiful for serverless, so the context has
        to be stated rather than assumed."
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Product"
      example:
        - POD
        - SERVERLESS
    GpuCountFilter:
      name: count
      in: query
      required: false
      description: GPU count for availability and lowest-price calculations. Valid
        only with include=AVAILABILITY. Defaults to 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 2
    GpuCloudFilter:
      name: cloud
      in: query
      required: false
      description: "Cloud type for availability and lowest-price calculations. Valid
        only with include=AVAILABILITY. Supported values: SECURE, COMMUNITY.
        Upstream default when omitted: SECURE."
      schema:
        $ref: "#/components/schemas/GpuCloudFilter"
    CountryCodesFilter:
      name: countryCodes
      in: query
      required: false
      description: Comma-separated ISO 3166-1 alpha-2 country codes, uppercase, to
        constrain availability to — e.g. FR or FR,DE. Values within this filter
        use OR semantics. Valid only with include=AVAILABILITY (400 otherwise);
        a malformed entry is a 422. Scopes availability, lowest-price
        calculations and the dataCenters array to those countries, so a listed
        data center outside them is omitted rather than returned with
        availability NONE. On the list endpoint a GPU type with no data center
        in those countries drops out entirely; the single-GPU endpoint still
        returns the requested type, with availability NONE and dataCenters
        omitted, so a 404 keeps meaning the GPU type does not exist. Read the
        NONE on availability rather than the absence of dataCenters, which is
        also absent when availability was not requested.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: ^[A-Z]{2}$
      example:
        - FR
        - DE
    CudaVersionsFilter:
      name: cudaVersions
      in: query
      required: false
      description: "Comma-separated CUDA versions to scope availability and
        lowest-price calculations to, matched exactly. Format: major.minor, e.g.
        12.8 — a bare major is rejected here because it identifies no version.
        Valid only with include=AVAILABILITY (400 otherwise) and mutually
        exclusive with minCudaVersion (400 if both are sent); a malformed entry
        is a 422. Also narrows the returned cudaVersions array; omit it to
        enumerate every version offered."
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          pattern: ^\d+\.\d+$
      example:
        - "12.8"
        - "12.6"
    MinCudaVersionFilter:
      name: minCudaVersion
      in: query
      required: false
      description: "Lowest acceptable CUDA version to scope availability and
        lowest-price calculations to, compared numerically. Format: integer
        major or major.minor, e.g. 12 or 12.1 — unlike the `gpu.minCudaVersion`
        body field on pod and endpoint create, a bare major is accepted here and
        means any release of that major, because this filter only widens a read.
        Valid only with include=AVAILABILITY (400 otherwise) and mutually
        exclusive with cudaVersions (400 if both are sent); a malformed value is
        a 422. Use this for an open-ended floor and cudaVersions for an exact
        set."
      schema:
        type: string
        pattern: ^\d+(\.\d+)?$
      example: "12.1"
    CpuProductFilter:
      name: product
      in: query
      required: false
      description: "Comma-separated availability product contexts. Supported values
        for CPUs: POD, SERVERLESS. Required with include=AVAILABILITY, and valid
        only with it (400 either way). There is no default: availability differs
        by product."
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/CpuProduct"
        example:
          - POD
          - SERVERLESS
    CpuVCPUCountFilter:
      name: vcpuCount
      in: query
      required: false
      description: Availability vCPU count. Valid only with include=AVAILABILITY. Must
        be a power of two.
      schema:
        type: integer
        minimum: 2
      example: 4
    LogSourceParam:
      name: source
      in: query
      required: false
      description: Log source to stream. Omit to include both container and system logs.
      schema:
        $ref: "#/components/schemas/LogSource"
    LogTail:
      name: tail
      in: query
      required: false
      description: |
        Number of historical lines to backfill before streaming. Defaults to
        100 when omitted; set `0` to stream live with no backfill. Maximum 5000.
        Ignored when `since` or `Last-Event-ID` is provided — the resume cursor
        drives the backfill instead.
      schema:
        type: integer
        minimum: 0
        maximum: 5000
        default: 100
    LogSince:
      name: since
      in: query
      required: false
      description: |
        RFC3339 timestamp to resume from. Ignored when `Last-Event-ID` is
        provided. When set, the stream resumes from this point and `tail` is
        ignored.
      schema:
        type: string
        format: date-time
    LogLastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        SSE reconnect cursor — a timestamp emitted by this endpoint. Takes
        precedence over `since` and `tail`: when present, the stream resumes
        from this point. Sent automatically by EventSource on reconnect.
      schema:
        type: string
        format: date-time
  schemas:
    BaseContainerConfig:
      type: object
      description: >
        Container configuration universal to every containerized resource.
        Compose ContainerConfig instead unless the resource cannot support
        private registries (clusters, until the upstream input accepts a
        registry credential).
      properties:
        args:
          type: string
          description: Arguments passed to the container entrypoint
          examples:
            - ""
        disk:
          type: integer
          minimum: 1
          description: Container disk in GB (ephemeral, wiped on restart)
          examples:
            - 50
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables as key-value pairs
          examples:
            - JUPYTER_PASSWORD: hunter2
        image:
          type: string
          description: Docker image reference
          examples:
            - runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404
        ports:
          type: array
          description: Exposed ports, formatted as port/protocol
          items:
            type: string
          examples:
            - - 8888/http
              - 22/tcp
    ContainerConfig:
      description: >
        Reusable container configuration shared across templates, pods, and
        serverless endpoints. Adding a field here automatically propagates to
        all three resources.
      allOf:
        - $ref: "#/components/schemas/BaseContainerConfig"
        - type: object
          properties:
            registry:
              type:
                - string
                - "null"
              description: Container registry credential ID (for private images)
              examples:
                - null
    Mounts:
      type: object
      additionalProperties: false
      description: |
        Storage mounts attached to a pod. At-most-one of `persistent` or
        `network` may be set today (mutually exclusive, enforced at the
        handler with 400 if both are present). The `network` field is an
        array for forward compatibility with eventual multi-network-volume
        support, but `maxItems` is 1 today.

        PATCH semantics:
        - Omitting `mounts` or sending `{}` leaves the existing mount
          unchanged.
        - An explicit `network: []` is rejected with 400 (clearing mounts
          is not supported).
        - Mount kind is fixed at create — a PATCH that introduces a kind
          not present at create (persistent on a network pod, network on
          a persistent pod, or any mount on a previously-mountless pod)
          is rejected with 400.
        - The `volumeId` of a network mount is immutable; a PATCH that
          names a different `volumeId` is rejected with 400.
        - Partial mounts are not supported — every mount entry must
          include the full schema (`size` + `path` for persistent,
          `volumeId` + `path` for network). Missing required fields → 422.
      properties:
        persistent:
          $ref: "#/components/schemas/PersistentMount"
        network:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/NetworkMount"
    TemplateMounts:
      type: object
      additionalProperties: false
      description: |
        Storage mounts attached to a template. Templates support only a
        single persistent mount today; any `network` property is rejected
        with 422 by the schema validator.

        PATCH semantics: omitting `mounts` or sending `{}` leaves the
        existing mount unchanged.
      properties:
        persistent:
          $ref: "#/components/schemas/PersistentMount"
    PersistentMount:
      type: object
      required:
        - size
        - path
      additionalProperties: false
      description: |
        Host-local persistent storage. Pinned to the pod's host machine — data
        does not survive a host failure. Disallowed on CPU pods. Mutually
        exclusive with NetworkMount. Deprecated: prefer NetworkMount for any
        data you cannot recreate.
      properties:
        size:
          type: integer
          minimum: 10
          description: Host-local persistent storage in GB. Upstream enforces a 10 GB floor.
          examples:
            - 20
        path:
          type: string
          description: Mount path inside the container. May be changed via PATCH.
          examples:
            - /workspace
    NetworkMount:
      type: object
      required:
        - volumeId
        - path
      additionalProperties: false
      description: |
        Reference to a NetworkVolume. Custom paths are honored at runtime on
        both GPU and CPU pods. The underlying `volumeId` is immutable
        post-create; the mount `path` may be changed via PATCH.
      properties:
        volumeId:
          type: string
          description: ID of an existing NetworkVolume in the same data center as the pod.
          examples:
            - vol_xyz
        path:
          type: string
          description: Mount path inside the container. No default — must be specified
            explicitly.
          examples:
            - /runpod-volume
    GpuConfig:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: GPU type identifier
          examples:
            - NVIDIA GeForce RTX 4090
        count:
          type: integer
          minimum: 1
          default: 1
          description: Number of GPUs
          examples:
            - 1
    CreateGpuConfig:
      description: |
        GPU request for a pod create. Carries the CUDA host constraints, which
        live here rather than at the body's top level so they are
        unrepresentable on a CPU pod.
      allOf:
        - $ref: "#/components/schemas/GpuConfig"
        - type: object
          properties:
            allowedCudaVersions:
              type: array
              items:
                type: string
                pattern: ^\d+\.\d+$
              description: |
                Acceptable CUDA versions for the host machine, as `major.minor`.
                Omit to accept any version. Matching is exact, so a version no
                machine reports yields a capacity error rather than a fallback —
                discover valid values per GPU type via
                `GET /v2/catalog/gpus?include=AVAILABILITY&product=POD`
                (`cudaVersions`).

                A non-empty set is mutually exclusive with minCudaVersion (400
                if both are sent). An explicit `[]` states no constraint, so it
                may accompany a floor.
              examples:
                - - "12.8"
                  - "12.6"
            minCudaVersion:
              type: string
              pattern: ^\d+\.\d+$
              description: |
                Lowest acceptable CUDA version for the host machine, as
                `major.minor`, compared numerically rather than as a decimal —
                so 12.11 is above 12.2. Use this for an open-ended floor and
                allowedCudaVersions for an exact set.

                Mutually exclusive with a non-empty allowedCudaVersions (400 if
                both are sent); an explicit `[]` there states no constraint and
                may accompany this floor.
              examples:
                - "12.1"
      unevaluatedProperties: false
    BaseCpuConfig:
      type: object
      required:
        - id
        - vcpuCount
      properties:
        id:
          type: string
          description: CPU flavor identifier, as returned by GET /v2/catalog/cpus.
          examples:
            - cpu5c
          minLength: 1
        vcpuCount:
          type: integer
          minimum: 2
          description: Number of vCPUs. Must be valid for the selected CPU flavor and must
            be a power of two.
          examples:
            - 4
    CreateCpuConfig:
      allOf:
        - $ref: "#/components/schemas/BaseCpuConfig"
      unevaluatedProperties: false
    CpuConfig:
      allOf:
        - $ref: "#/components/schemas/BaseCpuConfig"
        - type: object
          required:
            - memory
          properties:
            memory:
              type: integer
              minimum: 1
              description: Memory allocated to the pod in GB.
              examples:
                - 16
    FlashBoot:
      type: string
      description: |
        FlashBoot cold-start acceleration mode.
        - `OFF`                — disabled
        - `FLASHBOOT`          — enabled
        - `PRIORITY_FLASHBOOT` — enabled with priority capacity
      enum:
        - OFF
        - FLASHBOOT
        - PRIORITY_FLASHBOOT
    EndpointType:
      type: string
      description: >
        Request-routing semantics for a modern serverless endpoint.

        - `QUEUE` — submit asynchronous or synchronous jobs through the managed
        queue.

        - `LOAD_BALANCER` — send requests directly to worker-defined HTTP paths.
          Configure via `env`: `PORT` (server port, default 80), `PORT_HEALTH`
          (health-check port, default 80), and `HEALTH_CHECK_PATH` (path the
          load balancer polls for worker health, default `/ping`).
      x-enum-varnames:
        - EndpointTypeQueue
        - EndpointTypeLoadBalancer
      enum:
        - QUEUE
        - LOAD_BALANCER
    QueueBasedRequestUrls:
      type: object
      additionalProperties: false
      required:
        - run
        - runSync
        - status
        - stream
        - cancel
        - retry
        - purgeQueue
        - health
      properties:
        run:
          type: string
          format: uri
          description: URL for asynchronously submitting a queued job.
          examples:
            - https://api.runpod.ai/v2/4m7x2k9q/run
        runSync:
          type: string
          format: uri
          description: URL for synchronously submitting a queued job. Accepts an optional
            `?wait=x` query parameter to control how long the request waits for
            job completion, defaulting to 90 seconds.
          examples:
            - https://api.runpod.ai/v2/4m7x2k9q/runsync
        status:
          type: string
          format: uri
          description: Check the current state, execution statistics, and results of a
            previously submitted job.
          examples:
            - https://api.runpod.ai/v2/4m7x2k9q/status/{job_id}
        stream:
          type: string
          format: uri
          description: Receive incremental results as they become available from a job
            that generates output progressively.
          examples:
            - https://api.runpod.ai/v2/4m7x2k9q/stream/{job_id}
        cancel:
          type: string
          format: uri
          description: Stop an in-progress job or remove a queued job before it starts.
          examples:
            - https://api.runpod.ai/v2/4m7x2k9q/cancel/{job_id}
        retry:
          type: string
          format: uri
          description: Requeue a failed or timed-out job without submitting a new request.
          examples:
            - https://api.runpod.ai/v2/4m7x2k9q/retry/{job_id}
        purgeQueue:
          type: string
          format: uri
          description: Remove all pending jobs from the queue. Does not affect in-progress
            jobs.
          examples:
            - https://api.runpod.ai/v2/4m7x2k9q/purge-queue
        health:
          type: string
          format: uri
          description: Overview of an endpoint's operational status.
          examples:
            - https://api.runpod.ai/v2/4m7x2k9q/health
    LoadBalancingRequestUrls:
      type: object
      additionalProperties: false
      required:
        - base
        - health
      properties:
        base:
          type: string
          format: uri
          description: Base URL for worker-defined HTTP and WebSocket paths.
          examples:
            - https://4m7x2k9q.api.runpod.ai
        health:
          type: string
          format: uri
          description: Health check endpoint the load balancer will periodically ping to
            decide if the worker is healthy enough to receive traffic.
            Configurable by setting the `HEALTH_CHECK_PATH` environment
            variable. Defaults to `/ping` if the variable is not set.
          examples:
            - https://4m7x2k9q.api.runpod.ai/ping
    EndpointRequestUrls:
      description: |
        Request URLs appropriate to the endpoint's top-level `type`.
        Queue-based endpoints provide job submission and management URLs;
        load-balancing endpoints provide `base` and `health` because their
        remaining paths are worker-defined.
      oneOf:
        - $ref: "#/components/schemas/QueueBasedRequestUrls"
        - $ref: "#/components/schemas/LoadBalancingRequestUrls"
    BaseEndpointGpuConfig:
      type: object
      properties:
        pools:
          type: array
          minItems: 1
          description: |
            Serverless GPU pool IDs (as returned by `GET /v2/catalog/gpus` in
            `pool`). Workers are placed on whichever listed pool has capacity.
            Narrow a pool down to specific cards with `excludedTypes`.
          items:
            type: string
          examples:
            - - ADA_24
        excludedTypes:
          type: array
          uniqueItems: true
          description: >
            GPU **type** IDs to subtract from the selected pools — the `id`

            field of `GET /v2/catalog/gpus`, the same identifiers pods take in

            `gpu.id`. Workers run on every type in `pools` except these. Omit to

            use the whole pool.


            Pools stay the unit of selection; types are the unit of

            subtraction. There is no inclusive allowlist: a card later added to

            one of your pools becomes eligible, which is the honest reading of

            "this pool, minus these".


            Tied to `pools`, because the two together are one selection:

            supplying `pools` replaces that selection wholesale, so a `PATCH`

            sending `pools` **without `excludedTypes`** **clears** them —

            restate them to keep them. A `PATCH` that omits `pools` leaves both

            the pools and the exclusions untouched, so changing only a CUDA

            constraint cannot widen a pinned endpoint.


            Rejected with 400 if a value is not a GPU type in one of `pools`;

            upstream accepts unrecognized exclusions silently, so a typo would

            otherwise produce a filter that does nothing. Surrounding whitespace

            is trimmed, so `" NVIDIA L40"` and `"NVIDIA L40"` mean the same
            card.
          items:
            type: string
            pattern: ^\s*[^-\s]
          examples:
            - - NVIDIA L40
        count:
          type: integer
          minimum: 1
          default: 1
          description: GPUs per worker
          examples:
            - 1
    EndpointGpuConfig:
      allOf:
        - $ref: "#/components/schemas/BaseEndpointGpuConfig"
        - type: object
          required:
            - pools
            - allowedCudaVersions
            - minCudaVersion
          properties:
            allowedCudaVersions:
              type: array
              items:
                type: string
              description: Acceptable CUDA versions for worker placement, as `major.minor`.
                Empty means any version.
              examples:
                - []
            minCudaVersion:
              type:
                - string
                - "null"
              description: Lowest acceptable CUDA version for worker placement, as
                `major.minor`. Null means no floor.
              examples:
                - null
    CreateEndpointGpuConfig:
      description: |
        GPU request for an endpoint create. Carries the CUDA constraints, which
        live here rather than at the body's top level so they are
        unrepresentable on a CPU endpoint.
      allOf:
        - $ref: "#/components/schemas/BaseEndpointGpuConfig"
        - type: object
          required:
            - pools
          properties:
            allowedCudaVersions:
              type: array
              items:
                type: string
                pattern: ^\d+\.\d+$
              description: |
                Acceptable CUDA versions for worker placement, as
                `major.minor`. Omit to accept any version (or inherit the
                template's constraint when creating from `templateId`).
                Matching is exact — discover valid values per GPU type via
                `GET /v2/catalog/gpus?include=AVAILABILITY&product=SERVERLESS`
                (`cudaVersions`).

                A non-empty set is mutually exclusive with minCudaVersion (400
                if both are sent). An explicit `[]` states no constraint, so it
                may accompany a floor.
              examples:
                - - "12.8"
                  - "12.6"
            minCudaVersion:
              type: string
              pattern: ^\d+\.\d+$
              description: |
                Lowest acceptable CUDA version for worker placement, as
                `major.minor`, compared numerically rather than as a decimal —
                so 12.11 is above 12.2. Use this for an open-ended floor and
                allowedCudaVersions for an exact set.

                Mutually exclusive with a non-empty allowedCudaVersions (400 if
                both are sent); an explicit `[]` there states no constraint and
                may accompany this floor.
              examples:
                - "12.1"
      unevaluatedProperties: false
    UpdateEndpointGpuConfig:
      description: |
        Partial GPU update — every field is optional and an omitted one is left
        unchanged. Unlike create, `pools` is optional, so changing only a CUDA
        constraint does not require resending the pool list.

        `excludedTypes` requires `pools`, because the two are one selection and
        only a supplied `pools` replaces it — an exclusion on its own would
        otherwise be silently dropped.
      allOf:
        - $ref: "#/components/schemas/BaseEndpointGpuConfig"
        - type: object
          dependentRequired:
            excludedTypes:
              - pools
          properties:
            allowedCudaVersions:
              type: array
              items:
                type: string
                pattern: ^\d+\.\d+$
              description: |
                Acceptable CUDA versions for worker placement, as
                `major.minor`. An explicit `[]` clears the constraint;
                omitting the field leaves it unchanged. Takes effect as
                workers are replaced.

                A non-empty set is mutually exclusive with minCudaVersion (400
                if both are sent). An explicit `[]` states no constraint, so it
                may accompany a floor.
                Setting one does not clear the other — clear it explicitly in
                the same patch if the endpoint already carries it.
            minCudaVersion:
              type: string
              pattern: ^$|^\d+\.\d+$
              description: |
                Lowest acceptable CUDA version for worker placement, as
                `major.minor`. An explicit `""` clears the floor; omitting the
                field leaves it unchanged. Takes effect as workers are
                replaced.

                Mutually exclusive with a non-empty allowedCudaVersions (400 if
                both are sent); an explicit `[]` there states no constraint and
                may accompany this floor.
              examples:
                - "12.1"
      unevaluatedProperties: false
    EndpointWorkers:
      type: object
      additionalProperties: false
      properties:
        min:
          type: integer
          minimum: 0
          description: Minimum number of workers.
          examples:
            - 0
        max:
          type: integer
          minimum: 0
          description: Maximum number of workers.
          examples:
            - 5
        idleTimeout:
          type: integer
          minimum: 1
          maximum: 3600
          description: >
            Seconds before idle workers scale down. Not applicable to
            queue-based

            endpoints scaling on `requestCount` — rejected on create/update and

            omitted from responses for that combination.
          examples:
            - 5
    QueueDelayScaling:
      type: object
      additionalProperties: false
      description: Scale on queue wait time. Queue-based endpoints only.
      required:
        - type
        - queueDelay
      properties:
        type:
          type: string
          description: Scaler discriminator. Always `QUEUE_DELAY` for this variant.
          enum:
            - QUEUE_DELAY
        queueDelay:
          type: number
          format: float
          minimum: 0.5
          description: Adjusts the number of workers based on how long requests wait in
            the queue.
          examples:
            - 4
    RequestCountScaling:
      type: object
      additionalProperties: false
      description: |
        Scale on concurrent in-flight requests per worker. Required for
        load-balancing endpoints; also selectable for queue-based.
      required:
        - type
        - requestCount
      properties:
        type:
          type: string
          description: Scaler discriminator. Always `REQUEST_COUNT` for this variant.
          enum:
            - REQUEST_COUNT
        requestCount:
          type: integer
          minimum: 1
          description: Adjusts the number of workers based on active in-flight requests.
          examples:
            - 4
    EndpointScaling:
      description: |
        Autoscaling signal — a discriminated union on `type`: `QUEUE_DELAY`
        (queue-based endpoints only) or `REQUEST_COUNT`. The scaler is chosen
        independently of the endpoint's routing `type` and can be switched on
        update.
      oneOf:
        - $ref: "#/components/schemas/QueueDelayScaling"
        - $ref: "#/components/schemas/RequestCountScaling"
      discriminator:
        propertyName: type
        mapping:
          QUEUE_DELAY: "#/components/schemas/QueueDelayScaling"
          REQUEST_COUNT: "#/components/schemas/RequestCountScaling"
    Endpoint:
      allOf:
        - $ref: "#/components/schemas/ContainerConfig"
        - type: object
          required:
            - id
            - name
            - workers
            - scaling
            - dataCenterIds
            - networkVolumes
            - timeout
            - flashboot
            - createdAt
          properties:
            id:
              type: string
              examples:
                - ep_abc123
            name:
              type: string
              examples:
                - my-inference
            type:
              $ref: "#/components/schemas/EndpointType"
            requestUrls:
              $ref: "#/components/schemas/EndpointRequestUrls"
            gpu:
              anyOf:
                - $ref: "#/components/schemas/EndpointGpuConfig"
                - type: "null"
            cpu:
              type: array
              minItems: 1
              description: |
                Eligible CPU configurations for each worker, in the order they
                were submitted. Present for CPU endpoints and omitted for GPU
                endpoints. Memory is derived from the selected flavor's catalog
                RAM multiplier.
              items:
                $ref: "#/components/schemas/CpuConfig"
            workers:
              allOf:
                - $ref: "#/components/schemas/EndpointWorkers"
              required:
                - min
                - max
            scaling:
              $ref: "#/components/schemas/EndpointScaling"
            dataCenterIds:
              type: array
              items:
                type: string
              examples:
                - - US-TX-3
            networkVolumes:
              type: array
              items:
                type: string
              examples:
                - - vol_abc
            timeout:
              type: integer
              description: Per-request execution timeout in milliseconds
              examples:
                - 300000
            flashboot:
              $ref: "#/components/schemas/FlashBoot"
            createdAt:
              type: string
              format: date-time
              examples:
                - 2026-03-13T20:00:00Z
    ListEndpointsResponse:
      type: object
      required:
        - endpoints
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/Endpoint"
    WorkerStatus:
      type: string
      description: |
        Derived worker state, reconciled from the worker pod's lifecycle status
        and the live job-queue view.
        - `RUNNING`      — actively processing a job
        - `IDLE`         — ready and polling for jobs
        - `INITIALIZING` — starting up, not yet ready
        - `THROTTLED`    — waiting on compute capacity
        - `UNHEALTHY`    — failing health checks
      x-enum-varnames:
        - WorkerStatusRunning
        - WorkerStatusIdle
        - WorkerStatusInitializing
        - WorkerStatusThrottled
        - WorkerStatusUnhealthy
      enum:
        - RUNNING
        - IDLE
        - INITIALIZING
        - THROTTLED
        - UNHEALTHY
    Worker:
      type: object
      required:
        - id
        - status
        - gpuCount
        - isStale
      properties:
        id:
          type: string
          examples:
            - worker_abc
        status:
          $ref: "#/components/schemas/WorkerStatus"
        isStale:
          type: boolean
          description: >
            True when the worker is running an older endpoint configuration than

            the current one (e.g. mid rolling-update). This is the authoritative

            flag: it is derived from `version` vs the response's
