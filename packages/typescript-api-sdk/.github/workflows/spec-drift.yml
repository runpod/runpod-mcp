name: Daily production spec update
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-spec-update
  cancel-in-progress: false
jobs:
  update:
    # Scheduled runs use the default branch. Reject manual runs from other refs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      RUNPOD_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/requirements.txt
      # Public schema only. Pull validates before replacing the vendored spec.
      - run: pnpm spec:pull
      - run: pnpm generate
      - run: pnpm generate:check
      - run: pnpm test:spec
      - run: pnpm test:scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:package
      - run: pnpm test:examples
      # The update PR carries its own version bump and changelog, so merging it
      # releases. Main's pending changesets are consumed into the same version.
      - name: Version the spec update
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet -- spec/openapi.yaml src/generated/schema.ts; then
            echo 'No spec change; nothing to version.'
            exit 0
          fi
          cat > .changeset/production-spec-update.md <<EOF
          ---
          '@runpod/typescript-api-sdk': minor
          ---

          Refresh the vendored production spec as of $(date -u +%Y-%m-%d) and
          regenerate the types. Validation run: $RUN_URL
          EOF
          pnpm changeset:version
      # Run even with no diff so the action can close a superseded update PR.
      - name: Create or update the spec review PR
        id: update-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: automation/production-spec
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            spec/openapi.yaml
            src/generated/schema.ts
            .changeset
            package.json
            CHANGELOG.md
            pnpm-lock.yaml
          commit-message: 'chore(spec): refresh production API contract'
          title: 'chore(spec): review production API contract update'
          body: |
            Refresh the vendored production OpenAPI document and regenerate SDK types.

            Source: https://api.runpod.io/v2/openapi.json
            Validation run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Generation, contract tests, typechecking, runtime tests, packed consumers,
            and mocked examples passed on Node 24 before this PR was updated.
            The SDK checks workflow is also dispatched on this branch for Node 20/22/24.
            Check those results before merging.

            Review removed or changed operations, request/response types, and compatibility.
            This PR bumps the version as a minor release and writes the changelog.
            **Merging it publishes that version to npm** and creates the tag and GitHub release.
            This branch is regenerated from the default branch: put durable fixes there,
            rather than editing the bot branch.

            No automatic merge.
      - name: Run the full runtime matrix on the generated branch
        if: steps.update-pr.outputs.pull-request-number != '' && steps.update-pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_BRANCH: ${{ steps.update-pr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$UPDATE_BRANCH"
      - name: Report result
        env:
          UPDATE_URL: ${{ steps.update-pr.outputs.pull-request-url }}
          UPDATE_OPERATION: ${{ steps.update-pr.outputs.pull-request-operation }}
        run: |
          if [ -n "$UPDATE_URL" ] && [ "$UPDATE_OPERATION" != "closed" ]; then
            printf 'Spec review PR: %s\n' "$UPDATE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No outstanding production spec update.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report failure
        if: failure()
        run: |
          printf 'Spec automation failed. Inspect this run; generation/validation failures prevent PR updates. No merge or release was performed.\n' >> "$GITHUB_STEP_SUMMARY"
